name: Commit validation

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact submitted history and current PR title
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.event_name == 'pull_request' && github.token || '' }}
        run: ./tools/Test-CommitSubjects.ps1
      - name: Exercise the commit and event fixtures
        shell: pwsh
        run: ./tools/Test-CommitSubjects.Tests.ps1
