  const defaults = {
    user: "%LOCALAPPDATA%\\Programs\\opssh",
    machine: "%ProgramFiles%\\opssh"
  };
  const languageOptions = [["en", "English"], ["zh", "简体中文"]];
  const environment = {
    locale: "browser",
    token: "standard",
    existingScope: "user",
    owner: "opssh",
    service: "present",
    installOutcome: "success",
    removeOutcome: "success",
    uacResponse: "ask",
    pace: "automatic"
  };
  const installSteps = ["language", "license", "scope", "directory"];
  const stageSymbols = { good: "✓", skipped: "–", warn: "!", error: "×", info: "·" };
  const stageNames = { good: "statusGood", skipped: "statusSkipped", warn: "statusWarn", error: "statusError", info: "statusInfo" };
  let state;
  let timer;
  let prompt = null;
  let priorFocus;

  function systemLanguage() {
    if (environment.locale !== "browser") return environment.locale === "zh" ? "zh" : "en";
    return /^zh(?:$|-(?:hans|cn|sg)(?:-|$))/i.test(navigator.language) ? "zh" : "en";
  }

  function label(key, lang = state.lang) {
    return words[key][lang === "zh" ? 1 : 0];
  }

  function reset(mode, focus = false) {
    clearTimeout(timer);
    prompt = null;
    state = {
      mode,
      lang: systemLanguage(),
      step: mode === "install" ? "language" : "confirm",
      accepted: false,
      scope: "user",
      paths: { ...defaults },
      directoryError: "",
      startup: true,
      launch: false,
      applied: null,
      run: null
    };
    view.announcement.textContent = "";
    render(focus ? '[data-body] select, [data-footer] .default-button' : "");
  }

  function busy() {
    return state.step === "progress";
  }

  function canRestoreService() {
    return environment.owner === "opssh" && environment.service === "present";
  }

  function needsElevation() {
    if (environment.token === "elevated") return false;
    if (state.mode === "remove") return environment.existingScope === "machine" || canRestoreService();
    return state.scope === "machine";
  }

  function validFolder(value) {
    return /^(?:[a-z]:|%(?:localappdata|userprofile|programfiles)%)(?:\\[^\\/:*?"<>|%\u0000-\u001f]+)+\\?$/i.test(value)
      && !value.split("\\").some(part => /[ .]$/.test(part));
  }

  function folderError(value) {
    if (!validFolder(value)) return "directoryError";
    const protectedForUser = /^(?:%programfiles%|[a-z]:\\(?:Program Files(?: \(x86\))?|Windows|ProgramData))(?:\\|$)/i;
    const unsafeForMachine = /^(?:%(?:localappdata|userprofile)%|[a-z]:\\(?:Users|Windows))(?:\\|$)/i;
    if (state.scope === "user" && protectedForUser.test(value)) return "protectedDirectory";
    if (state.scope === "machine" && unsafeForMachine.test(value)) return "machineDirectory";
    return "";
  }

  function optionList(options, selected) {
    return options.map(([value, name]) => `<option value="${value}"${value === selected ? " selected" : ""}>${name}</option>`).join("");
  }

  function makeButton(action, key, { primary = false, disabled = false, shield = false, lang = state.lang } = {}) {
    return `<button type="button" data-action="${action}"${primary ? ' class="default-button"' : ""}${disabled ? " disabled" : ""}${shield ? ` aria-label="${label(key, lang)}. ${label("privilege", lang)}"` : ""}>${shield ? '<span class="shield" aria-hidden="true"></span>' : ""}${label(key, lang)}</button>`;
  }

  function checkbox(name, key, checked) {
    return `<label class="check"><input type="checkbox" data-field="${name}"${checked ? " checked" : ""}><span>${label(key)}</span></label>`;
  }

  function scopeChoice(scope) {
    const desc = scope === "user" ? "userHint" : "machineHint";
    return `<label class="check">
      <input type="radio" name="opssh-setup-scope" data-field="scope" value="${scope}"${state.scope === scope ? " checked" : ""}>
      <span>${label(scope)}<span class="choice-description secondary-text">${label(desc)}</span></span>
    </label>`;
  }

  function logRows() {
    return state.run.log.map(({ key, kind }) => `<li data-kind="${kind}">
      <span class="log-icon" aria-hidden="true">${stageSymbols[kind]}</span>
      <span><span class="screen-reader">${label(stageNames[kind])}. </span>${label(key)}</span>
    </li>`).join("");
  }

  function logList() {
    return `<ol class="log" data-log aria-label="${label("log")}">${logRows()}</ol>`;
  }

  function logDetails() {
    if (!state.run?.log.length) return "";
    return `<details><summary>${label("logDetails")}</summary>${logList()}</details>`;
  }

  function renderProgress() {
    return `<div class="progress-state">
      <div class="progress-label"><span data-progress-text>${label(state.run.status)}</span><span data-progress-percent>${state.run.percent}%</span></div>
      <progress value="${state.run.percent}" max="100" aria-labelledby="opssh-setup-step"></progress>
    </div>
    <h3>${label("log")}</h3>
    ${logList()}`;
  }

  function renderBody() {
    const install = state.mode === "install";
    switch (state.step) {
      case "language":
        return ["languageHeading", "languageIntro", `<label class="field">
          <span>${label("languageField")}</span>
          <select data-field="language">${optionList(languageOptions, state.lang)}</select>
        </label><p class="secondary-text">${label("languageHint")}</p>`];
      case "license":
        return ["licenseHeading", "licenseIntro", `<div class="license-text">
          <h3>${label("licenseName")}</h3>
          <blockquote class="license-excerpt" lang="en">“License” shall mean the terms and conditions for use, reproduction, and distribution as defined by Sections 1 through 9 of this document.</blockquote>
          <details><summary>${label("licenseFull")}</summary><pre lang="en" data-license-text></pre></details>
        </div>
        ${checkbox("accepted", "licenseAck", state.accepted)}
        <p class="secondary-text">${label("licensePreview")}</p>`];
      case "scope":
        return ["scopeHeading", "scopeIntro", scopeChoice("user") + scopeChoice("machine")];
      case "directory":
        return ["directoryHeading", "directoryIntro", `<label class="field">
          <span>${label("directoryField")}</span>
          <input type="text" class="folder" data-field="directory" maxlength="240" spellcheck="false" autocomplete="off"
            aria-invalid="${Boolean(state.directoryError)}" aria-describedby="opssh-setup-directory-error">
        </label>
        <p id="opssh-setup-directory-error" class="validation-error" role="alert"${state.directoryError ? "" : " hidden"}>${state.directoryError ? label(state.directoryError) : ""}</p>
        <div class="folder-actions">${makeButton("default-folder", "directoryReset")}</div>
        <p>${label("installReady")}</p>`];
      case "confirm":
        return ["removeHeading", "removeIntro", `<p>${label("removeBody")}</p>
          <p>${label(environment.owner === "opssh" ? "restoreNotice" : "otherNotice")}</p>
          <p>${label("dataKept")}</p>`];
      case "progress":
        return [install ? "installing" : "removing", "progressIntro", renderProgress()];
      case "installed":
        return ["installed", "installedIntro", `${checkbox("startup", "login", state.startup)}
          ${checkbox("launch", "launch", state.launch)}
          <p class="secondary-text">${label("finishEffect")}</p>${logDetails()}`];
      case "removed":
        return ["removed", "removedIntro", `<div class="result-summary"><p>${label("dataPreserved")}</p>
          <p>${label(state.run.owner === "opssh" ? (state.run.restoreService ? "restoreDone" : "restoreSkipped") : "otherNotice")}</p></div>
          ${logDetails()}`];
      case "result": {
        const failed = state.run.result === "error";
        const title = failed ? (install ? "installFailed" : "removeFailed") : (install ? "installCanceled" : "removeCanceled");
        return [title, state.run.resultDetail, `${install ? "" : `<p>${label("dataPreserved")}</p>`}${logDetails()}`];
      }
      case "closed":
        return [install ? "setupClosed" : "uninstallClosed", "closedIntro", state.applied
          ? `<div class="result-summary"><p>${label(state.applied.startup ? "startupApplied" : "startupNotApplied")}</p>
             <p>${label(state.applied.launch ? "launchApplied" : "launchNotApplied")}</p></div>`
          : state.run?.result === "success" && install ? `<p>${label("completionDiscarded")}</p>` : ""];
    }
  }

  function renderFooter() {
    const index = installSteps.indexOf(state.step);
    const cancel = makeButton("cancel", "cancel", { disabled: Boolean(state.run?.rollingBack) });
    const advance = state.step === "directory"
      ? makeButton("start", "install", { primary: true, shield: needsElevation() })
      : makeButton("next", "next", { primary: true, disabled: state.step === "license" && !state.accepted });
    if (index >= 0) return makeButton("back", "back", { disabled: index === 0 }) + advance + cancel;
    if (state.step === "confirm") return makeButton("start", "remove", { primary: true, shield: needsElevation() }) + cancel;
    if (state.step === "progress") return cancel;
    if (state.step === "closed") return makeButton("replay", "replay", { primary: true });
    return makeButton("finish", "finish", { primary: true });
  }

  function renderSimulation() {
    const lang = systemLanguage();
    const inFlight = busy() || Boolean(prompt);
    const select = (field, key, options) => `<label class="field"><span>${label(key, lang)}</span>
      <select data-environment="${field}"${inFlight ? " disabled" : ""}>
        ${optionList(options, environment[field])}
      </select></label>`;
    const choices = (...keys) => keys.map(key => [key, label(key, lang)]);
    const install = state.mode === "install";
    view["simulation-caption"].textContent = label("simulation", lang);
    view.simulation.innerHTML = select("locale", "locale", [
      ["browser", label("browserLanguage", lang)], ...languageOptions, ["other", label("otherLanguage", lang)]
    ]) + select("token", "token", choices("standard", "administrator", "elevated"))
      + (install ? "" : select("existingScope", "existingScope", choices("user", "machine"))
        + select("owner", "owner", choices("opssh", "openssh", "otherAgent"))
        + select("service", "service", choices("present", "absent")))
      + (install
        ? select("installOutcome", "outcome", choices("success", "installError"))
        : select("removeOutcome", "outcome", canRestoreService()
          ? choices("success", "restoreError", "removalError", "rollbackError")
          : choices("success", "removalError", "rollbackError")))
      + select("uacResponse", "uacResponse", choices("ask", "deny"))
      + select("pace", "pace", choices("automatic", "manual"))
      + (busy() && environment.pace === "manual" ? `<div>${makeButton("advance", "advance", { disabled: Boolean(prompt) })}</div>` : "");
    if (busy() && environment.pace === "manual") simulationPanel.open = true;
  }

  function render(focus = "") {
    const lang = systemLanguage();
    const isInstall = state.mode === "install";
    const [heading, intro, content] = renderBody();
    root.lang = state.lang === "zh" ? "zh-Hans" : "en";
    nav.lang = simulationPanel.lang = lang === "zh" ? "zh-Hans" : "en";
    nav.setAttribute("aria-label", label("previewNavigation", lang));
    view.caption.textContent = label("preview", lang);
    for (const [mode, button] of [["install", buttons.firstElementChild], ["remove", buttons.lastElementChild]]) {
      button.textContent = label(mode === "install" ? "installPreview" : "removePreview", lang);
      button.setAttribute("aria-pressed", String(mode === state.mode));
      button.disabled = busy();
    }
    view.title.textContent = label(isInstall ? "installTitle" : "removeTitle");
    titlebar.lastElementChild.setAttribute("aria-label", label("close"));
    titlebar.lastElementChild.disabled = state.step === "closed" || Boolean(state.run?.rollingBack);
    view.heading.textContent = label(heading);
    view.intro.textContent = label(intro);
    view.body.innerHTML = content;
    view.footer.innerHTML = renderFooter();
    if (state.step === "directory") root.querySelector('[data-field="directory"]').value = state.paths[state.scope];
    if (state.step === "license") {
      const fullText = root.querySelector("[data-license-text]");
      fullText.textContent = license.content.querySelector("pre").textContent.trim();
      fullText.parentElement.querySelector("summary").setAttribute("aria-label", `${label("licenseFull")}. ${label("licenseHint")}.`);
    }
    renderSimulation();
    renderPrompt();
    if (focus) root.querySelector(focus)?.focus();
  }

  function renderPrompt() {
    view.prompt.hidden = !prompt;
    for (const area of [nav, titlebar, view.heading.parentElement.parentElement, view.body, view.footer, simulationPanel]) {
      area.inert = Boolean(prompt);
    }
    if (!prompt) {
      view.prompt.replaceChildren();
      return;
    }
    const install = state.mode === "install";
    const uac = prompt === "uac";
    const lang = uac ? systemLanguage() : state.lang;
    const credentials = uac && environment.token === "standard";
    const title = uac ? "uac" : (install ? "cancelInstallPrompt" : "cancelRemovePrompt");
    const body = uac ? (install ? "uacInstall" : "uacRemove") : (busy() ? "cancelPromptBody" : "cancelBeforePromptBody");
    const confirm = uac
      ? makeButton("uac-allow", credentials ? "uacSimulateApproval" : "uacAccept", { lang })
      : makeButton("confirm-cancel", "endOperation");
    const dismiss = uac
      ? makeButton("uac-deny", credentials ? "cancel" : "uacCancel", { primary: true, lang })
      : makeButton("resume", "keepGoing", { primary: true });
    view.prompt.innerHTML = `<div class="prompt-dialog" role="dialog" aria-modal="true" lang="${lang === "zh" ? "zh-Hans" : "en"}"
      aria-labelledby="opssh-setup-prompt-title" aria-describedby="opssh-setup-prompt-body">
      <h3 id="opssh-setup-prompt-title">${uac ? '<span class="shield" aria-hidden="true"></span>' : ""}${label(title, lang)}</h3>
      <div id="opssh-setup-prompt-body">
        <p>${label(body, lang)}</p>
        ${credentials ? `<p>${label("uacCredentials", lang)}</p>` : ""}
      </div>
      <div class="prompt-actions">${confirm}${dismiss}</div>
    </div>`;
  }

  function showPrompt(type) {
    clearTimeout(timer);
    priorFocus = document.activeElement;
    prompt = type;
    renderPrompt();
    view.prompt.querySelector(".default-button").focus();
  }

  function dismissPrompt() {
    prompt = null;
    renderPrompt();
    priorFocus?.focus();
    priorFocus = null;
  }

  function installStages(outcome) {
    return [
      ["validateInstall", 10],
      ["copyFiles", 48, "undoInstallFiles", outcome === "installError" ? "installFileError" : null],
      ["installShortcut", 76, "undoInstallShortcut"],
      ["registerMsi", 100]
    ];
  }

  function removeStages(outcome) {
    const wasDefault = environment.owner === "opssh";
    const restoration = canRestoreService()
      ? ["restoreService", 42, "undoRestoreService", outcome === "restoreError" ? "serviceError" : null]
      : ["noService", 42, null, null, "skipped"];
    const agent = wasDefault
      ? [["releaseDefault", 32, "undoReleaseDefault"], restoration]
      : [["noRestore", 42, null, null, "skipped"]];
    return [
      ["validateRemove", 10],
      ["stopCore", 22, "undoStopCore"],
      ...agent,
      ["removeStartup", 53, "undoRemoveStartup"],
      ["removeNotifications", 61, "undoRemoveNotifications"],
      ["removeShortcuts", 70, "undoRemoveShortcuts"],
      ["removeFiles", 82, "undoRemoveFiles", ["removalError", "rollbackError"].includes(outcome) ? "removeFileError" : null],
      ["keepData", 92, null, null, "info"],
      ["removeMsi", 100]
    ];
  }

  function startOperation() {
    const install = state.mode === "install";
    if (install) {
      state.directoryError = folderError(state.paths[state.scope].trim());
      if (state.directoryError) {
        render('[data-field="directory"]');
        return;
      }
    }
    const outcome = install ? environment.installOutcome : environment.removeOutcome;
    state.run = {
      stages: install ? installStages(outcome) : removeStages(outcome),
      outcome,
      owner: environment.owner,
      restoreService: canRestoreService(),
      needsElevation: needsElevation(),
      askedForElevation: false,
      index: 0,
      percent: 0,
      status: "ready",
      log: [],
      undo: [],
      rollingBack: false,
      rollbackFailed: false,
      result: null,
      resultDetail: null
    };
    state.step = "progress";
    render(environment.pace === "manual" ? '[data-action="advance"]' : '[data-footer] button');
    schedule();
  }

  function updateProgress() {
    const run = state.run;
    view.body.querySelector("[data-progress-text]").textContent = label(run.status);
    view.body.querySelector("[data-progress-percent]").textContent = `${run.percent}%`;
    view.body.querySelector("progress").value = run.percent;
  }

  function record(key, kind, percent = state.run.percent, status = key) {
    const run = state.run;
    run.log.push({ key, kind });
    run.percent = percent;
    run.status = status;
    updateProgress();
    const log = view.body.querySelector("[data-log]");
    log.innerHTML = logRows();
    log.scrollTop = log.scrollHeight;
    view.announcement.textContent = label(key);
  }

  function schedule() {
    clearTimeout(timer);
    if (busy() && !prompt && environment.pace === "automatic") {
      timer = setTimeout(advanceOperation, 550);
    }
  }

  function finishResult(result, detail) {
    clearTimeout(timer);
    state.run.rollingBack = false;
    state.run.result = result;
    state.run.resultDetail = detail;
    state.step = result === "success" ? (state.mode === "install" ? "installed" : "removed") : "result";
    render('[data-footer] .default-button');
    view.announcement.textContent = view.heading.textContent;
  }

  function startRollback(result) {
    const run = state.run;
    if (!run.undo.length) {
      finishResult(result, "noChanges");
      return;
    }
    run.rollingBack = true;
    run.rollbackStages = run.undo.length;
    run.result = result;
    run.status = "rollingBack";
    run.percent = 0;
    updateProgress();
    view.footer.querySelector("button").disabled = true;
    titlebar.lastElementChild.disabled = true;
    schedule();
  }

  function advanceRollback(run) {
    const key = run.undo.shift();
    if (!key) {
      const detail = run.rollbackFailed ? "partialRollback" : state.mode === "install" ? "installReverted" : "removeReverted";
      finishResult(run.result, detail);
      return;
    }
    const percent = Math.round(100 * (1 - run.undo.length / run.rollbackStages));
    if (key === "undoRemoveFiles" && run.outcome === "rollbackError") {
      run.rollbackFailed = true;
      record("undoFileError", "error", percent, "rollingBack");
    } else {
      record(key, "good", percent, "rollingBack");
    }
    schedule();
  }

  function answerElevation(allowed) {
    if (prompt === "uac") dismissPrompt();
    if (allowed) {
      record("elevationGranted", "good", 16);
      schedule();
    } else {
      record("elevationCanceled", "warn");
      finishResult("canceled", "consentDenied");
    }
  }

  function advanceOperation() {
    if (!busy() || prompt) return;
    const run = state.run;
    if (run.rollingBack) {
      advanceRollback(run);
      return;
    }
    if (run.index === 1 && run.needsElevation && !run.askedForElevation) {
      run.askedForElevation = true;
      run.status = "waiting";
      updateProgress();
      if (environment.uacResponse === "deny") answerElevation(false);
      else showPrompt("uac");
      return;
    }
    if (run.index === run.stages.length) {
      finishResult("success");
      return;
    }
    const [key, percent, undo, error, kind = "good"] = run.stages[run.index++];
    if (undo) run.undo.unshift(undo);
    if (error) {
      record(error, "error", percent);
      startRollback("error");
      return;
    }
    record(key, kind, percent);
    if (percent === 100) {
      view.footer.querySelector("button").disabled = true;
      titlebar.lastElementChild.disabled = true;
    }
    schedule();
  }

  function requestCancel() {
    if (state.step === "closed") return;
    if (state.step === "installed" || state.step === "removed" || state.step === "result") {
      state.step = "closed";
      render('[data-action="replay"]');
      return;
    }
    if (!state.run?.rollingBack && state.run?.percent !== 100) showPrompt("cancel");
  }

  function cancelOperation() {
    dismissPrompt();
    if (!busy()) {
      state.run = { log: [], result: "canceled", resultDetail: "noChanges" };
      finishResult("canceled", "noChanges");
      return;
    }
    record("cancelLogged", "warn");
    startRollback("canceled");
  }

  function clearFolderError() {
    state.directoryError = "";
    const field = view.body.querySelector('[data-field="directory"]');
    field.setAttribute("aria-invalid", "false");
    view.body.querySelector(".validation-error").hidden = true;
  }

  root.addEventListener("input", event => {
    if (event.target.dataset.field !== "directory") return;
    state.paths[state.scope] = event.target.value;
    clearFolderError();
  });

  root.addEventListener("change", event => {
    const control = event.target;
    const setting = control.dataset.environment;
    if (setting) {
      environment[setting] = control.value;
      if (!canRestoreService() && environment.removeOutcome === "restoreError") environment.removeOutcome = "success";
      if (setting === "locale" && (state.mode === "remove" || state.step === "language")) state.lang = systemLanguage();
      render(`[data-environment="${setting}"]`);
      return;
    }
    switch (control.dataset.field) {
      case "language":
        state.lang = control.value;
        render('[data-field="language"]');
        break;
      case "accepted":
        state.accepted = control.checked;
        view.footer.querySelector('[data-action="next"]').disabled = !state.accepted;
        break;
      case "scope":
        state.scope = control.value;
        state.directoryError = "";
        break;
      case "startup":
        state.startup = control.checked;
        break;
      case "launch":
        state.launch = control.checked;
        break;
    }
  });

  root.addEventListener("click", event => {
    const action = event.target.closest("button")?.dataset.action;
    switch (action) {
      case "install-preview":
      case "remove-preview": {
        const mode = action === "install-preview" ? "install" : "remove";
        if (state.mode !== mode) reset(mode, true);
        break;
      }
      case "replay":
        reset(state.mode, true);
        break;
      case "next":
      case "back": {
        const index = installSteps.indexOf(state.step);
        state.step = installSteps[index + (action === "next" ? 1 : -1)];
        render('[data-body] :is(select, input:checked, input:not([type="radio"])), [data-footer] .default-button:not(:disabled)');
        view.announcement.textContent = view.heading.textContent;
        break;
      }
      case "default-folder": {
        state.paths[state.scope] = defaults[state.scope];
        const field = view.body.querySelector('[data-field="directory"]');
        field.value = state.paths[state.scope];
        clearFolderError();
        field.focus();
        break;
      }
      case "start":
        startOperation();
        break;
      case "advance":
        advanceOperation();
        break;
      case "cancel":
      case "close":
        requestCancel();
        break;
      case "resume":
        dismissPrompt();
        schedule();
        break;
      case "confirm-cancel":
        cancelOperation();
        break;
      case "uac-allow":
      case "uac-deny":
        answerElevation(action === "uac-allow");
        break;
      case "finish":
        if (state.step === "installed") state.applied = { startup: state.startup, launch: state.launch };
        state.step = "closed";
        render('[data-action="replay"]');
        view.announcement.textContent = view.body.textContent;
        break;
    }
  });

  root.addEventListener("keydown", event => {
    if (event.key === "Enter" && event.target.dataset.field === "directory" && !event.isComposing) {
      event.preventDefault();
      startOperation();
      return;
    }
    if (event.key !== "Escape" || event.target.matches("select") || !event.target.closest(".setup-window")) return;
    event.preventDefault();
    if (prompt === "uac") answerElevation(false);
    else if (prompt === "cancel") {
      dismissPrompt();
      schedule();
    } else requestCancel();
  });

  // Outside the embedded viewer, use the operating system’s color scheme.
  if (getComputedStyle(root).colorScheme === "normal") root.style.colorScheme = "light dark";
  reset("install");
})();
</script>
