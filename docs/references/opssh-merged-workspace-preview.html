    appearance: ['Appearance', '外观'], theme: ['Theme', '主题'], language: ['Language', '语言'], system: ['System', '跟随系统'], light: ['Light', '浅色'], dark: ['Dark', '深色'],
    reopen: ['Reopen', '重新打开'], pendingLanguage: ['Reopen the workspace to apply English.', '重新打开工作区以应用简体中文。'],
    integration: ['SSH integration', 'SSH 集成'], startup: ['Start at sign-in', '登录时启动'], startupHelp: ['Start opssh when you sign in to Windows.', '登录 Windows 时启动 opssh。'],
    defaultAgent: ['Windows default SSH agent', 'Windows 默认 SSH 代理'], separatePipe: ['opssh is using its dedicated pipe.', 'opssh 正在使用专用管道。'],
    defaultPipe: ['opssh is using the Windows OpenSSH pipe.', 'opssh 正在使用 Windows OpenSSH 管道。'],
    setDefault: ['Set as default', '设为默认'], restore: ['Restore OpenSSH', '还原 OpenSSH'], elevatedHelp: ['Administrator approval required', '需要管理员批准'],
    setDefaultTitle: ['Make opssh the default SSH agent?', '将 opssh 设为默认 SSH 代理？'],
    restoreTitle: ['Restore Windows OpenSSH?', '还原 Windows OpenSSH？'],
    defaultHelp: ['opssh may stop and disable the Windows OpenSSH agent service before it takes over the default pipe.', 'opssh 可能会先停止并禁用 Windows OpenSSH 代理服务，再接管默认管道。'],
    restoreHelp: ['opssh releases the default pipe so Windows OpenSSH can use it again.', 'opssh 会释放默认管道，以便 Windows OpenSSH 重新使用。'],
    serviceStep: ['OpenSSH service', 'OpenSSH 服务'], pipeStep: ['Default agent pipe', '默认代理管道'], persistStep: ['Save selection', '保存选择'], recoveryStep: ['Recover service state', '恢复服务状态'], recordRecoveryStep: ['Save recovery state', '保存恢复状态'],
    working: ['In progress', '进行中'], done: ['Completed', '已完成'], skipped: ['Skipped', '已跳过'], failed: ['Failed', '失败'], pending: ['Pending', '待定'],
    switchSuccess: ['Default agent updated.', '已更新默认代理。'], switchFailed: ['The default agent pipe is unavailable.', '默认代理管道不可用。'],
    switchPending: ['The service change is pending. Recovery state was saved.', '服务更改仍在等待。已保存恢复状态。'],
    aboutHelp: ['A Windows SSH agent backed by 1Password Desktop.', '使用 1Password 桌面应用的 Windows SSH 代理。'],
    license: ['License', '许可证']
  };
  const escape = value => String(value).replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
  const translate = (language, key) => wording[key][language === 'zh-Hans' ? 1 : 0];
  const icon = name => `<i data-lucide="${name}" aria-hidden="true">${glyphs[name] || ''}</i>`;
  const stamp = value => `<time datetime="2026-11-10T${value}">2026-11-10 ${value}</time>`;
  const systemLanguage = /^zh(?:$|-(?:hans|cn|sg)(?:-|$))/i.test(navigator.language) ? 'zh-Hans' : 'en';
  const normalSize = { width: 1240, height: 700 };
  const dimensions = (variant, width) => width === 'min' ? variant : normalSize;
  const preview = {
    width: root.dataset.previewWidth || 'normal',
    theme: root.dataset.previewTheme || 'system',
    language: root.dataset.previewLanguage || 'en',
    scenario: root.dataset.previewScenario === 'first-run' ? 'unbound' : root.dataset.previewScenario || 'ready',
    elevation: root.dataset.previewElevation || 'standard',
    outcome: root.dataset.previewOutcome || 'success'
  };
  if (preview.scenario === 'elevated') {
    preview.scenario = 'ready';
    preview.elevation = 'elevated';
  }
  const previewControls = [...root.querySelectorAll('[data-review]')];
  for (const control of previewControls) {
    const value = preview[control.dataset.review];
    if ([...control.options].some(option => option.value === value)) control.value = value;
    else preview[control.dataset.review] = control.value;
  }

  function mount(section, variant) {
    const windowElement = section.querySelector('.window');
    const frame = section.querySelector('.window-frame');
    const readout = section.querySelector('.size-readout');
    windowElement.innerHTML = '<div class="window-content"></div><p class="info" role="status"></p>';
    const windowContent = windowElement.querySelector('.window-content');
    const feedback = windowElement.querySelector('.info');
    const model = {
      route: routes.includes(root.dataset.previewPage) ? root.dataset.previewPage : 'keys',
      theme: 'system', language: preview.language, languagePreference: preview.language, pendingLanguage: null, pane: false, vaultExpanded: false,
      modal: null, feedback: '', startup: true, defaultAgent: false, clock: 0, scroll: new Map()
    };
    const t = key => translate(model.language, key);
    const a = key => escape(t(key));
    const brand = glyph => `<span class="brand">${icon(glyph)}</span>`;
    const requiresElevation = () => preview.elevation !== 'elevated' && preview.outcome !== 'service-absent';
    let feedbackTimer;

    function seedConnection() {
      const bound = preview.scenario === 'ready';
      model.account = bound ? accounts[0] : null;
      model.scope = new Set(bound ? ['personal', 'engineering'] : []);
      model.index = bound ? keys.slice() : [];
      model.loaded = new Set(bound ? [keys[0].id] : []);
      model.expanded = new Set();
      model.grants = bound ? [firstGrant] : [];
      model.activity = bound ? sampleActivity.slice() : [];
      model.vaultAt = bound ? '15:17:12' : null;
      model.keyAt = bound ? '15:18:04' : null;
      model.accessAt = model.vaultAt;
      model.vaultExpanded = false;
      model.modal = null;
      model.feedback = '';
      if (!bound && model.route === 'activity') model.route = 'keys';
    }
    seedConnection();

    function button(label, action, options = {}) {
      const { glyph, primary, disabled, accessible, expanded, controls } = options;
      return `<button type="button" class="button${primary ? ' primary' : ''}" data-action="${action}"${disabled ? ' disabled' : ''}${accessible ? ` aria-label="${escape(accessible)}"` : ''}${expanded === undefined ? '' : ` aria-expanded="${expanded}"`}${controls ? ` aria-controls="${controls}"` : ''}>${glyph ? icon(glyph) : ''}${escape(label)}</button>`;
    }

    function row(glyph, title, description, control = '') {
      return `<div class="setting-row">${icon(glyph)}<div class="description"><strong>${escape(title)}</strong>${description}</div>${control}</div>`;
    }

    function toggle(label, action, checked, disabled = false) {
      return `<label class="toggle"><span class="small quiet" aria-hidden="true">${a(checked ? 'on' : 'off')}</span><input type="checkbox" role="switch" data-change="${action}" aria-label="${escape(label)}"${checked ? ' checked' : ''}${disabled ? ' disabled' : ''}></label>`;
    }

    function select(label, action, options, current) {
      return `<select aria-label="${escape(label)}" data-change="${action}">${options.map(([value, caption]) => `<option value="${value}"${value === current ? ' selected' : ''}>${escape(caption)}</option>`).join('')}</select>`;
    }

    function status(label, tone) {
      const name = { good: 'circle-check', warning: 'triangle-alert', error: 'circle-x' }[tone];
      return `<span class="status ${tone || 'quiet'}">${name ? icon(name) : ''}<span>${escape(label)}</span></span>`;
    }

    const small = value => `<span class="quiet small">${value}</span>`;
    const stampText = value => `<span class="sync-stamp">${a('lastSuccess')} · ${value ? stamp(value) : a('never')}</span>`;

    function accountGroup() {
      const { name, email } = model.account;
      const actions = `<div class="actions account-actions">${button(t('switchAccount'), 'picker')}${button(t('removeAccount'), 'remove')}</div>`;
      const accountDetails = small(`${escape(name)} · ${escape(email)}`);
      const access = `${status(t('accessAllowed'), 'good')} ${small(stamp(model.accessAt))}`;
      if (variant.layout === 'compact') {
        return `<div class="group account-group">${row('user-round', t('selectedAccount'), `${accountDetails}${small(`${a('accessAllowed')} · ${stamp(model.accessAt)}`)}`, actions)}</div>`;
      }
      if (variant.layout === 'parallel') {
        return `<div class="group account-group">${row('user-round', t('selectedAccount'), accountDetails)}${row('shield', t('desktopAccess'), access)}${actions}</div>`;
      }
      return `<div class="stacked-account"><div class="group">${row('user-round', t('selectedAccount'), accountDetails, actions)}</div><div class="group">${row('shield', t('desktopAccess'), access)}</div></div>`;
    }

    function vaultGroup() {
      const compact = variant.layout === 'compact';
      const listId = `workspace-${variant.layout}-vaults`;
      const count = model.language === 'zh-Hans' ? `已允许 ${model.scope.size} / ${model.account.vaults.length} 个` : `${model.scope.size} of ${model.account.vaults.length} allowed`;
      const disclosure = compact ? button(count, 'vaults', { glyph: model.vaultExpanded ? 'chevron-down' : 'chevron-right', expanded: model.vaultExpanded, controls: listId }) : '';
      const rows = model.account.vaults.map(vault => row('vault', t(vault), '', toggle(t(vault), `vault:${vault}`, model.scope.has(vault)))).join('');
      return `<div class="group vault-group">
        ${row('vault', t('vaultScope'), stampText(model.vaultAt), `<div class="actions">${disclosure}${button(t('syncVaults'), 'sync-vaults', { glyph: 'refresh-cw' })}</div>`)}
        <div class="vault-list" id="${listId}"${compact && !model.vaultExpanded ? ' hidden' : ''}>${rows}</div>
      </div>`;
    }

    function approvalRow(grants, id) {
      const rows = grants.map(grant => `<tr><th scope="row">${escape(grant.process)}</th><td class="mono">${grant.pid}</td><td>${stamp(grant.expires)}</td><td>${button(t('revoke'), `revoke:${grant.id}`)}</td></tr>`).join('');
      return `<tr class="grant-row" id="${id}"><td colspan="4">${rows ? `<table aria-label="${a('approvals')}"><thead><tr><th scope="col">${a('process')}</th><th scope="col">PID</th><th scope="col">${a('expires')}</th><th scope="col">${a('actions')}</th></tr></thead><tbody>${rows}</tbody></table>` : `<p class="quiet">${a('noApprovals')}</p>`}</td></tr>`;
    }

    function keyTable() {
      const rows = model.index.map(key => {
        const loaded = model.loaded.has(key.id);
        const grants = model.grants.filter(grant => grant.key === key.id);
        const expanded = model.expanded.has(key.id);
        const approvalId = `workspace-${variant.layout}-approval-${key.id}`;
        const grantCount = model.language === 'zh-Hans' ? `${grants.length} 项` : String(grants.length);
        const actions = `<div class="key-actions">${button(t(loaded ? 'evict' : 'preload'), `${loaded ? 'evict' : 'preload'}:${key.id}`)}${button(t('copy'), `copy:${key.id}`, { glyph: 'copy' })}</div>`;
        const disclosure = button(grantCount, `approval:${key.id}`, { glyph: expanded ? 'chevron-down' : 'chevron-right', expanded,
          controls: expanded ? approvalId : undefined, accessible: `${key.name} · ${t('approvals')} (${grantCount})` });
        return `<tr><th scope="row"><div class="key-name"><strong>${escape(key.name)}</strong>${small(a(key.vault))}<code class="quiet mono">${key.fingerprint}</code></div></th>
          <td>${status(t(loaded ? 'loaded' : 'unloaded'), loaded ? 'good' : '')}</td><td>${disclosure}</td><td>${actions}</td></tr>${expanded ? approvalRow(grants, approvalId) : ''}`;
      }).join('');
      return `<div class="table-scroll" role="region" aria-label="${a('indexedKeys')}"><table class="key-table"><thead><tr>${['key', 'privateKey', 'approvals', 'actions'].map(label => `<th scope="col">${a(label)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
    }

    function workspace() {
      if (!model.account) return `<div class="login">${brand('key')}<h1>${a('connect')}</h1><p class="quiet">${a('connectHelp')}</p>${button(t('connect'), 'picker', { primary: true })}</div>`;
      return `<h1>${a('keys')}</h1>
        <section class="provider" data-layout="${variant.layout}" aria-label="1Password"><h2 class="provider-title">1Password</h2>${accountGroup()}${vaultGroup()}</section>
        <section class="keys" aria-label="${a('indexedKeys')}">
          <div class="section-head"><div><h2>${a('indexedKeys')}</h2>${stampText(model.keyAt)}</div>${button(t('syncKeys'), 'sync-keys', { glyph: 'refresh-cw', primary: true, disabled: !model.scope.size })}</div>
          ${model.index.length ? keyTable() : `<p class="empty">${a(model.scope.size ? 'noKeys' : 'selectVault')}</p>`}
        </section>`;
    }

    function activity() {
      const rows = model.activity.map(entry => `<tr><th scope="row">${escape(entry.process)}</th><td class="mono">${entry.pid}</td><td>${escape(entry.key)}</td><td>${status(t(entry.result), entry.result === 'signed' ? 'good' : 'warning')}</td><td>${stamp(entry.time)}</td></tr>`).join('');
      const columns = ['process', 'PID', 'key', 'result', 'time'].map(label => `<th scope="col">${label === 'PID' ? label : a(label)}</th>`).join('');
      return `<h1>${a('activity')}</h1>${rows ? `<div class="table-scroll" role="region" aria-label="${a('activity')}"><table class="activity-table"><thead><tr>${columns}</tr></thead><tbody>${rows}</tbody></table></div>` : `<p class="empty">${a('noActivity')}</p>`}`;
    }

    function settings() {
      const needsElevation = requiresElevation();
      const language = model.languagePreference;
      const action = model.defaultAgent ? 'restore' : 'setDefault';
      const pending = model.pendingLanguage;
      const targetLanguage = pending ? `<div class="pending-language" lang="${language}"><span role="status">${escape(translate(pending, 'pendingLanguage'))}</span>${button(translate(pending, 'reopen'), 'reopen')}</div>` : '';
      return `<h1>${a('settings')}</h1>
        <section class="settings-group"><h2>${a('appearance')}</h2><div class="group">
          ${row('palette', t('theme'), '', select(t('theme'), 'theme', ['system', 'light', 'dark'].map(value => [value, t(value)]), model.theme))}
          ${row('languages', t('language'), '', select(t('language'), 'language', [['system', t('system')], ['en', 'English'], ['zh-Hans', '简体中文']], language))}${targetLanguage}
        </div></section>
        <section class="settings-group"><h2>${a('integration')}</h2><div class="group">
          ${row('power', t('startup'), small(a('startupHelp')), toggle(t('startup'), 'startup', model.startup))}
          ${row('plug-zap', t('defaultAgent'), small(a(model.defaultAgent ? 'defaultPipe' : 'separatePipe')), button(t(action), 'default-agent', { glyph: needsElevation ? 'shield' : '', disabled: !model.startup, accessible: needsElevation ? `${t(action)} · ${t('elevatedHelp')}` : '' }))}
        </div></section>`;
    }

    function about() {
      return `<h1>${a('about')}</h1><div class="group">${row('terminal', 'opssh', small(a('aboutHelp')))}${row('badge-info', t('license'), '', '<span>Apache License 2.0</span>')}</div>`;
    }

    function dialog(title, body, footer) {
      const titleId = `workspace-${variant.layout}-dialog`;
      return `<div class="modal-backdrop"><div class="dialog" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="${titleId}"><div class="dialog-body"><h2 id="${titleId}">${escape(title)}</h2>${body}</div><div class="dialog-footer">${footer}</div></div></div>`;
    }

    function renderDialog() {
      const modal = model.modal;
      if (!modal) return '';
      const cancel = button(t('cancel'), 'dismiss');
      const close = button(t('close'), 'dismiss');
      if (modal.kind === 'picker') {
        const choices = accounts.map(account => `<label class="account-option"><input type="radio" name="workspace-${variant.layout}-account" data-change="candidate" value="${account.id}"${modal.account === account ? ' checked' : ''}><span><strong>${escape(account.name)}</strong>${small(escape(account.email))}</span></label>`).join('');
        return dialog(t('chooseAccount'), `<p class="quiet">${a('chooseHelp')}</p>${choices}`, `${cancel}${button(t('continue'), 'connect', { primary: true })}`);
      }
      if (modal.kind === 'remove') return dialog(t('removeTitle'), `<p class="quiet">${a('removeHelp')}</p>`, `${cancel}${button(t('removeAccount'), 'disconnect', { primary: true })}`);
      if (modal.kind === 'copy') return dialog(t('copy'), `<p class="quiet">${a('copyHelp')}</p><textarea readonly rows="3" class="copy-field mono" aria-label="${a('copy')}">${escape(modal.value)}</textarea>`, close);
      const title = t(modal.restore ? 'restoreTitle' : 'setDefaultTitle');
      const help = `<p class="quiet">${a(modal.restore ? 'restoreHelp' : 'defaultHelp')}</p>`;
      if (modal.phase === 'confirm') return dialog(title, help, `${cancel}${button(t('continue'), 'confirm-agent', { primary: true, glyph: requiresElevation() ? 'shield' : '' })}`);
      const tones = { done: 'good', failed: 'error', pending: 'warning' };
      const steps = modal.steps.map(step => `<li><span>${a(step.label)}</span>${status(t(step.state), tones[step.state])}</li>`).join('');
      const result = modal.result ? `<p role="status">${a(modal.result)}</p>` : '';
      return dialog(title, `${help}<ol class="steps" aria-live="polite">${steps}</ol>${result}`, modal.phase === 'finished' ? close : button(t('close'), 'dismiss', { disabled: true }));
    }

    function render({ enter = false, focusAction = '' } = {}) {
      const before = windowElement.querySelector('.page');
      if (before) model.scroll.set(before.dataset.route, [before.scrollTop, before.querySelector('.table-scroll')?.scrollLeft || 0]);
      const active = document.activeElement;
      const hadFocus = windowElement.contains(active);
      const action = focusAction || (hadFocus ? active.dataset.action : '');
      const change = hadFocus ? active.dataset.change : '';
      const value = hadFocus ? active.value : '';
      const size = dimensions(variant, preview.width);
      const compact = size.width < 1007;
      const overlay = compact && model.pane;
      const modal = Boolean(model.modal);
      const inert = modal ? ' inert' : '';
      windowElement.lang = model.language;
      windowElement.dataset.compact = compact;
      windowElement.dataset.paneOpen = overlay;
      windowElement.dataset.theme = model.theme;
      const paneButton = compact ? `<button type="button" class="nav-button pane-toggle" data-action="pane" aria-expanded="${overlay}" aria-label="${a('togglePane')}">${icon('menu')}</button>` : '';
      const nav = routes.map(route => `<button type="button" class="nav-button" data-action="nav:${route}" aria-label="${a(route)}"${compact && !overlay ? ` data-tooltip="${a(route)}"` : ''}${model.route === route ? ' aria-current="page"' : ''}${!model.account && route === 'activity' ? ' disabled' : ''}>${icon(({ keys: 'key', about: 'info' })[route] || route)}<span class="nav-label">${a(route)}</span></button>`).join('');
      const page = { keys: workspace, activity, settings, about }[model.route]();
      windowContent.innerHTML = `<header class="titlebar"${inert}>${paneButton}${brand('terminal')}<span class="app-name">opssh</span><span class="caption" aria-hidden="true"><span>−</span><span>□</span><span>×</span></span></header>
        <div class="shell"${inert}>
          <nav class="pane" data-overlay="${overlay}" aria-label="${a('navigation')}">${nav}</nav>
          ${overlay ? '<div class="pane-scrim" data-action="pane" aria-hidden="true"></div>' : ''}
          <main class="page" data-route="${model.route}" data-enter="${enter}"><div class="page-content">${page}</div></main>
        </div>${renderDialog()}`;
      globalThis.lucide?.createIcons?.({ attrs: { width: 16, height: 16 } });
      if (feedback.textContent !== model.feedback) {
        clearTimeout(feedbackTimer);
        feedback.textContent = model.feedback;
        if (model.feedback) feedbackTimer = setTimeout(() => {
          model.feedback = '';
          feedback.textContent = '';
        }, 3200);
      }
      const current = windowElement.querySelector('.page');
      const [top, left] = model.scroll.get(model.route) || [0, 0];
      current.scrollTop = top;
      const table = current.querySelector('.table-scroll');
      if (table) table.scrollLeft = left;
      const focusRoot = modal ? windowElement.querySelector('.dialog') : windowElement;
      const sameAction = action && [...focusRoot.querySelectorAll('[data-action]')].find(node => node.dataset.action === action && node.matches('button:enabled'));
      const sameChange = change && [...focusRoot.querySelectorAll('[data-change]')].find(node => node.dataset.change === change && (change !== 'candidate' || node.value === value));
      const dialogFocus = modal && focusRoot.querySelector('.copy-field, input:checked, .primary:enabled, button:enabled');
      const focus = sameAction || sameChange || dialogFocus || (modal ? focusRoot : null);
      if (focus) focus.focus({ preventScroll: true });
    }

    function fit(availableWidth, stageHeight) {
      const size = dimensions(variant, preview.width);
      const scale = Math.min(1, availableWidth / size.width);
      section.style.setProperty('--stage-height', `${stageHeight}px`);
      frame.style.setProperty('--scaled-width', `${size.width * scale}px`);
      frame.style.setProperty('--scaled-height', `${size.height * scale}px`);
      windowElement.style.setProperty('--window-width', `${size.width}px`);
      windowElement.style.setProperty('--window-height', `${size.height}px`);
      windowElement.style.setProperty('--scale', scale);
      readout.textContent = `${size.width} × ${size.height} DIP${scale < 1 ? ` · ${Math.round(scale * 100)}%` : ''}`;
    }

    function tick() {
      model.clock += 1;
      const minutes = 20 + Math.floor(model.clock / 60);
      const pad = value => String(value).padStart(2, '0');
      return `${pad(15 + Math.floor(minutes / 60))}:${pad(minutes % 60)}:${pad(model.clock % 60)}`;
    }

    function activateAccount(account) {
      if (account !== model.account) {
        model.account = account;
        model.scope.clear();
        model.index = [];
        model.loaded.clear();
        model.expanded.clear();
        model.grants = [];
        model.activity = [];
        model.keyAt = null;
        model.vaultExpanded = false;
      }
      model.vaultAt = account ? tick() : null;
      model.accessAt = model.vaultAt;
      model.modal = null;
      model.feedback = '';
    }

    async function copyPublicKey(id) {
      const key = keys.find(item => item.id === id);
      const publicKey = `ssh-ed25519 ${key.blob} opssh-preview-${key.id}@example.test`;
      const account = model.account;
      const stillCurrent = () => model.account === account && model.route === 'keys' && model.index.includes(key) && !model.modal;
      try {
        await navigator.clipboard.writeText(publicKey);
        if (!stillCurrent()) return;
        model.feedback = t('copied');
      } catch {
        if (!stillCurrent()) return;
        model.modal = { kind: 'copy', value: publicKey, from: `copy:${id}` };
      }
      render();
      windowElement.querySelector('.copy-field')?.select();
    }

    function confirmAgent() {
      const modal = model.modal;
      const outcome = preview.outcome;
      const steps = [
        { label: 'serviceStep', final: { 'service-absent': 'skipped', 'service-pending': 'pending' }[outcome] || 'done' },
        { label: 'pipeStep', final: { 'pipe-failure': 'failed', 'service-pending': 'skipped' }[outcome] || 'done' },
        { label: 'persistStep', final: { 'pipe-failure': 'skipped', 'service-pending': 'skipped' }[outcome] || 'done' },
        { label: outcome === 'service-pending' ? 'recordRecoveryStep' : 'recoveryStep', final: ['pipe-failure', 'service-pending'].includes(outcome) ? 'done' : 'skipped' }
      ];
      modal.phase = 'running';
      modal.steps = [];
      function start(index) {
        const step = { ...steps[index], state: 'working' };
        modal.steps.push(step);
        render();
        setTimeout(() => {
          if (model.modal !== modal) return;
          step.state = step.final;
          if (index + 1 < steps.length) {
            start(index + 1);
            return;
          }
          const successful = outcome === 'success' || outcome === 'service-absent';
          if (successful) {
            model.defaultAgent = !modal.restore;
            if (modal.turnOffStartup) model.startup = false;
          }
          modal.phase = 'finished';
          modal.result = successful ? 'switchSuccess' : outcome === 'pipe-failure' ? 'switchFailed' : 'switchPending';
          render();
        }, 360);
      }
      start(0);
    }

    function dismiss() {
      if (!model.modal || model.modal.phase === 'running') return;
      const from = model.modal.from;
      model.modal = null;
      render({ focusAction: from });
    }

    windowElement.addEventListener('click', event => {
      const control = event.target.closest('[data-action]');
      if (!control || control.disabled) return;
      const [action, value] = control.dataset.action.split(':');
      switch (action) {
        case 'nav': {
          const enter = model.route !== value;
          model.route = value;
          model.pane = false;
          if (enter) model.feedback = '';
          render({ enter });
          return;
        }
        case 'pane': model.pane = !model.pane; break;
        case 'picker': model.modal = { kind: 'picker', account: accounts[0], from: 'picker' }; break;
        case 'remove': model.modal = { kind: 'remove', from: 'remove' }; break;
        case 'connect': activateAccount(model.modal.account); break;
        case 'disconnect': activateAccount(null); break;
        case 'dismiss': dismiss(); return;
        case 'vaults': model.vaultExpanded = !model.vaultExpanded; break;
        case 'sync-vaults':
          model.vaultAt = tick();
          model.accessAt = model.vaultAt;
          model.feedback = t('vaultsSynced');
          break;
        case 'sync-keys':
          model.index = keys.filter(key => model.scope.has(key.vault));
          model.keyAt = tick();
          model.feedback = t('keysSynced');
          break;
        case 'preload': model.loaded.add(value); break;
        case 'evict': model.loaded.delete(value); break;
        case 'copy': void copyPublicKey(value); return;
        case 'approval':
          if (model.expanded.has(value)) model.expanded.delete(value);
          else model.expanded.add(value);
          break;
        case 'revoke': model.grants = model.grants.filter(grant => grant.id !== value); break;
        case 'reopen':
          model.language = model.pendingLanguage;
          model.pendingLanguage = null;
          model.pane = false;
          model.feedback = '';
          break;
        case 'default-agent': model.modal = { kind: 'agent', restore: model.defaultAgent, phase: 'confirm', from: 'default-agent' }; break;
        case 'confirm-agent': confirmAgent(); return;
        default: return;
      }
      const focusAction = ['preload', 'evict'].includes(action) ? `${action === 'preload' ? 'evict' : 'preload'}:${value}` : '';
      render({ focusAction });
    });

    windowElement.addEventListener('change', event => {
      const control = event.target.closest('[data-change]');
      if (!control) return;
      const [action, value] = control.dataset.change.split(':');
      switch (action) {
        case 'theme': model.theme = control.value; break;
        case 'language': {
          model.languagePreference = control.value;
          const target = control.value === 'system' ? systemLanguage : control.value;
          model.pendingLanguage = target === model.language ? null : target;
          break;
        }
        case 'startup':
          if (!control.checked && model.defaultAgent) {
            model.modal = { kind: 'agent', restore: true, turnOffStartup: true, phase: 'confirm', from: 'default-agent' };
          } else {
            model.startup = control.checked;
          }
          break;
        case 'candidate': model.modal.account = accounts.find(account => account.id === control.value); return;
        case 'vault': {
          if (control.checked) model.scope.add(value);
          else {
            model.scope.delete(value);
            const retired = model.index.filter(key => key.vault === value);
            model.index = model.index.filter(key => key.vault !== value);
            for (const key of retired) {
              model.loaded.delete(key.id);
              model.expanded.delete(key.id);
            }
            model.grants = model.grants.filter(grant => !retired.some(key => key.id === grant.key));
          }
          model.feedback = t('vaultUpdated');
          break;
        }
        default: return;
      }
      render();
    });

    windowElement.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (model.modal) dismiss();
      else if (model.pane) {
        model.pane = false;
        render({ focusAction: 'pane' });
      } else return;
      event.stopPropagation();
    });

    return {
      fit,
      render,
      update(setting) {
        if (setting === 'scenario') seedConnection();
        if (setting === 'width') model.pane = false;
        if (setting === 'theme') model.theme = 'system';
        if (setting === 'language') {
          model.language = model.languagePreference = preview.language;
          model.pendingLanguage = null;
          model.feedback = '';
        }
        render();
      }
    };
  }

  const sections = [...root.querySelectorAll('.viz-carousel > [data-variant]')];
  const workspaces = sections.map((section, index) => mount(section, variants[index]));

  function fitStages() {
    const availableWidth = Math.max(1, root.clientWidth - 2);
    const stageHeight = Math.max(...variants.map(variant => {
      const size = dimensions(variant, preview.width);
      return Math.ceil(size.height * Math.min(1, availableWidth / size.width));
    }));
    workspaces.forEach(workspace => workspace.fit(availableWidth, stageHeight));
  }

  root.dataset.theme = preview.theme;
  workspaces.forEach(workspace => workspace.render());
  fitStages();
  new ResizeObserver(fitStages).observe(root);
  root.addEventListener('change', event => {
    const setting = event.target.dataset.review;
    if (!setting) return;
    preview[setting] = event.target.value;
    root.dataset.theme = preview.theme;
    workspaces.forEach(workspace => workspace.update(setting));
    if (setting === 'width') fitStages();
  });
})();
</script>
