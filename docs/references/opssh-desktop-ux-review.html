<div id="opssh-desktop-ux-review" lang="zh-Hans" aria-label="opssh SSH 代理工作区"></div>

<style>

      position: absolute; z-index: 2; inset: 38px auto 0 0; width: 152px;
      background: var(--mica); border-inline-end: 1px solid var(--line); box-shadow: 6px 0 18px #0003;
    }
    #opssh-desktop-ux-review .ops-layout[data-pane="expanded"] .ops-surface { grid-column: 2; }
    #opssh-desktop-ux-review .ops-main { padding: 14px; }
  }
  @container ops-content (max-width: 590px) {
    #opssh-desktop-ux-review .ops-table :is(th,td) { padding-inline: 8px; }
    #opssh-desktop-ux-review .ops-key-table colgroup { display: none; }
    #opssh-desktop-ux-review .ops-key-table > thead { display: none; }
    #opssh-desktop-ux-review .ops-key-table, #opssh-desktop-ux-review .ops-key-table > tbody { display: block; }
    #opssh-desktop-ux-review .ops-key-table > tbody > tr { display: flex; flex-wrap: wrap; align-items: center; }
    #opssh-desktop-ux-review .ops-key-table > tbody > tr:first-child { border-top: 0; }
    #opssh-desktop-ux-review .ops-key-table > tbody > tr > :is(td,th) { display: block; width: auto; }
    #opssh-desktop-ux-review .ops-key-table > tbody > tr > :first-child, #opssh-desktop-ux-review .ops-key-table > tbody > .ops-expanded > td { flex: 1 1 100%; }
    #opssh-desktop-ux-review .ops-key-table > tbody > tr > td[data-label]::before {
      content: attr(data-label); display: block; color: var(--quiet); font-size: 11px;
    }
  }
  @container ops-content (max-width: 475px) {
    #opssh-desktop-ux-review .ops-activity-filters { position: relative; }
    #opssh-desktop-ux-review .ops-activity-filter { position: static; }
    #opssh-desktop-ux-review .ops-activity-filter-menu { max-width: min(240px, 100%); }
    #opssh-desktop-ux-review .ops-setting-row { grid-template-columns: 16px minmax(0,1fr); padding: 9px; }
    #opssh-desktop-ux-review .ops-setting-row > :nth-child(3) { grid-column: 2; justify-self: start; }
    #opssh-desktop-ux-review .ops-grant-table colgroup { display: none; }
    #opssh-desktop-ux-review .ops-grant-table > thead { display: none; }
    #opssh-desktop-ux-review .ops-grant-table, #opssh-desktop-ux-review .ops-grant-table > tbody { display: block; }
    #opssh-desktop-ux-review .ops-grant-table > tbody > tr { display: flex; flex-wrap: wrap; align-items: center; }
    #opssh-desktop-ux-review .ops-grant-table > tbody > tr > :is(td,th) { display: block; max-width: 100%; }
    #opssh-desktop-ux-review .ops-grant-table > tbody > tr > :first-child { flex: 1 1 100%; }
    #opssh-desktop-ux-review .ops-grant-table td[data-label]::before {
      content: attr(data-label); display: block; color: var(--quiet); font-family: var(--font); font-size: 11px;
    }
  }
  @media (pointer: coarse) {
    #opssh-desktop-ux-review :is(button,select,input:not([type="checkbox"])) { min-height: 44px; }
    #opssh-desktop-ux-review :is(input,select) { font-size: 16px; }
    #opssh-desktop-ux-review .ops-activity-filter-option { min-height: 44px; }
  }
  #opssh-desktop-ux-review .ops-inline-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  #opssh-desktop-ux-review .ops-row-note { display: grid; justify-items: start; gap: 5px; margin-top: 6px; }
  #opssh-desktop-ux-review .ops-row-error { color: var(--danger); }
  #opssh-desktop-ux-review .ops-scan { display: grid; gap: 8px; padding: 12px 14px; }
  #opssh-desktop-ux-review .ops-scan progress { inline-size: 100%; block-size: 8px; accent-color: var(--accent); }
  #opssh-desktop-ux-review .ops-picker-account { min-width: 0; overflow-wrap: anywhere; }
  #opssh-desktop-ux-review .ops-login .ops-account-notice { text-align: start; }
  #opssh-desktop-ux-review .ops-login .ops-account-notice .ops-actions { justify-content: center; }
  #opssh-desktop-ux-review .ops-dialog .ops-dialog-log-files { display: grid; gap: 6px; padding: 0; list-style: none; }
  #opssh-desktop-ux-review .ops-dialog-log-files li { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  #opssh-desktop-ux-review .ops-dialog-log-files code { overflow-wrap: anywhere; }
  #opssh-desktop-ux-review .ops-setting-row > div { min-width: 0; overflow-wrap: anywhere; }
</style>

<script>
(() => {
  const root = document.getElementById("opssh-desktop-ux-review");
  const vaults = [
    { id: "work", name: "Engineering" },
    { id: "personal", name: "Personal" },
    { id: "archive", name: "Archive" }
  ];
  const catalog = [
    { id: "workstation", vaultId: "work", vault: "Engineering", name: "workstation", fingerprint: "SHA256:…qZ2mFY" },
    { id: "build", vaultId: "work", vault: "Engineering", name: "build-server", fingerprint: "SHA256:…L4wR8A" },
    { id: "lab", vaultId: "personal", vault: "Personal", name: "lab-access", fingerprint: "SHA256:…tH9cKQ" },
    { id: "archived", vaultId: "archive", vault: "Archive", name: "archive-access", fingerprint: "SHA256:…vD6pS8" }
  ];
  const pages = {
    account: ["1Password", "user-round"], keys: ["SSH 密钥", "key-round"],
    activity: ["活动", "activity"], settings: ["设置", "settings"], about: ["关于", "info"]
  };
  const accountChoices = {
    "demo@example.test": "demo@example.test",
    "engineering@example.test": "Alex Chen(engineering@example.test)"
  };
  const accountLabel = id => accountChoices[id] || id;
  const cacheDefaults = { keyMode: "fixed", keySeconds: "300", approvalMode: "fixed", approvalSeconds: "600" };
  const settingDefaults = {
    schemaVersion: 1, startup: false, systemDefault: false, waitForPassword: false,
    theme: "system", language: "system", autoUpdate: true, logging: false, logLevel: "INFO", ...cacheDefaults
  };
  const esc = value => String(value).replace(/[&<>"']/g, char =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
  const icon = name => name === "github"
    ? '<span class="ops-github-mark" aria-hidden="true"></span>'
    : `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const quiet = value => `<p class="ops-quiet">${value}</p>`;
  const button = (label, action, { primary = false, disabled = false, glyph = "", labelFor = "" } = {}) =>
    `<button type="button" class="ops-button${primary ? " ops-primary" : ""}" data-action="${esc(action)}"${disabled ? " disabled" : ""}${labelFor ? ` aria-label="${esc(labelFor)}"` : ""}>${glyph ? icon(glyph) : ""}${label}</button>`;
  const textButton = (label, action) =>
    `<button type="button" class="ops-text-button" data-action="${action}">${label}</button>`;
  const iconButton = (label, action, glyph) =>
    `<button type="button" class="ops-icon-button" aria-label="${label}" data-action="${action}">${icon(glyph)}</button>`;
  const heading = (title, description, actions = "") =>
    `<header class="ops-heading"><div><h1>${title}</h1>${description ? quiet(description) : ""}</div>${actions ? `<div class="ops-actions">${actions}</div>` : ""}</header>`;
  const info = (message, { kind = "info", dismissible = false } = {}) =>
    `<div class="ops-infobar" data-kind="${kind}">${icon(kind === "warning" ? "triangle-alert" : "info")}<p>${message}</p>${dismissible ? iconButton("关闭提示", "dismiss", "x") : ""}</div>`;
  const row = (glyph, title, description, control = "", detail = "") =>
    `<div class="ops-setting-row">${icon(glyph)}<div><strong>${title}</strong>${description ? quiet(description) : ""}</div><div>${control}</div>${detail ? `<div class="ops-setting-detail">${detail}</div>` : ""}</div>`;
  const select = (label, action, choices, value, { disabled = false } = {}) =>
    `<select data-action="${action}" aria-label="${label}"${disabled ? " disabled" : ""}>${Object.entries(choices).map(([id, name]) =>
      `<option value="${id}"${id === value ? " selected" : ""}>${name}</option>`).join("")}</select>`;
  const toggle = (label, action, value, { disabled = false } = {}) =>
    `<label class="ops-switch"><input type="checkbox" role="switch" data-action="${action}" aria-label="${label}"${value ? " checked" : ""}${disabled ? " disabled" : ""}><span>${value ? "开" : "关"}</span></label>`;
  const metricState = (label, tone = "neutral") => `<span class="ops-status" data-tone="${tone}">${esc(label)}</span>`;
  const appIcon = glyph => `<span class="ops-app-icon" aria-hidden="true">${icon(glyph)}</span>`;
  const timed = mode => mode === "fixed" || mode === "idle";

  function localTime(timestamp) {
    const value = new Date(timestamp);
    const pad = part => String(part).padStart(2, "0");
    return `${value.getFullYear()}-${pad(value.getMonth() + 1)}-${pad(value.getDate())} ${pad(value.getHours())}:${pad(value.getMinutes())}:${pad(value.getSeconds())}`;
  }

  const emptyActivityFilters = () => ({ process: new Set(), key: new Set(), result: new Set(), day: new Set() });

  function sampleActivity(now) {
    const examples = [
      ["warp.exe", "workstation", "已允许"],
      ["Code.exe", "build-server", "已允许"],
      ["WindowsTerminal.exe", "lab-access", "已拒绝"],
      ["Code.exe", "workstation", "已允许"],
      ["warp.exe", "build-server", "已取消"],
      ["WindowsTerminal.exe", "workstation", "已允许"],
      ["warp.exe", "lab-access", "已拒绝"]
    ];
    const appPids = { "warp.exe": 10432, "Code.exe": 13108, "WindowsTerminal.exe": 8420 };
    const commands = {
      workstation: "ssh -v -o ConnectTimeout=10 -o ForwardAgent=no -o ServerAliveInterval=30 workstation.example.test",
      "build-server": "ssh -T -o BatchMode=yes -o ControlMaster=no -o StrictHostKeyChecking=yes git@build.example.test",
      "lab-access": "ssh lab.example.test"
    };
    const entry = ([process, key, result], time) => ({ process, appPid: appPids[process], command: commands[key], key, result, time });
    const recent = examples.slice(0, 3).map((example, index) => entry(example, now - (2 + index * 4) * 60000));
    const history = [1, 2, 3].flatMap(days => examples.map((example, index) => {
      const time = new Date(now);
      time.setDate(time.getDate() - days);
      time.setHours(17 - index, 18, 0, 0);
      return entry(example, time.getTime());
    }));
    return [...recent, ...history];
  }

  function createModel(scenario, priorSettings = settingDefaults, startupAccount = "engineering@example.test") {
    const ready = ["ready", "provider-failed", "vault-save", "discover", "cache", "logs"].includes(scenario);
    const startup = scenario === "startup";
    const connected = ready || ["new-account", "no-access"].includes(scenario) || (startup && Boolean(startupAccount));
    const settings = { ...priorSettings, waitForPassword: startup || priorSettings.waitForPassword };
    if (scenario === "logs") Object.assign(settings, { logging: true, logLevel: "INFO" });
    const account = startup ? startupAccount : connected ? "engineering@example.test" : "";
    const allowed = ready ? ["work", "personal"] : [];
    const now = Date.now();
    return {
      settings,
      page: scenario === "discover" ? "keys" : ["cache", "logs"].includes(scenario) ? "settings" : "account", pane: "auto",
      connected, account, accountChoice: scenario === "picker" ? Object.keys(accountChoices)[0] : "",
      pickerIntent: "connect",
      availableAccounts: scenario === "no-accounts" || scenario === "cli-missing" ? {} : accountChoices,
      pickerStatus: scenario === "cli-missing" ? "missing" : scenario === "no-accounts" ? "empty" : "ready",
      showPickerNotice: scenario === "no-accounts" || scenario === "cli-missing",
      installOnRetry: scenario === "cli-missing",
      allowedVaults: new Set(allowed),
      lastDesktopRequest: connected && !startup && scenario !== "no-access" ? { outcome: scenario === "provider-failed" ? "denied" : "success", at: now - 2 * 60000 } : null,
      vaultChange: null, vaultError: null, failNextVaultSave: scenario === "vault-save",
      scan: null, logsUsed: scenario === "logs" ? 1.4 : 0,
      hasDiscovered: ready, keys: ready ? catalog.filter(key => allowed.includes(key.vaultId)) : [],
      loaded: new Set(ready && settings.keyMode !== "off" ? ["workstation", "build"] : []), expanded: new Set(),
      grants: ready && settings.approvalMode !== "off" ? [
        { id: "warp", keyId: "workstation", process: "warp.exe", pid: 10432, expires: now + 8 * 60000 },
        { id: "terminal", keyId: "workstation", process: "WindowsTerminal.exe", pid: 8420, expires: now + 6 * 60000 },
        { id: "editor", keyId: "build", process: "Code.exe", pid: 13108, expires: now + 4 * 60000 }
      ] : [],
      activity: ready ? sampleActivity(now) : [],
      activityFilters: emptyActivityFilters(), activityFilterOpen: "",
      updateChecking: false, updateStatus: "", message: "", messageKind: "info",
      dialog: scenario === "picker" ? "login" : "",
      toast: startup, agentTransition: null
    };
  }

  const preview = { scenario: "ready", defaultOutcome: "success" };
  let model = createModel(preview.scenario);
  let renderedPage = "";
  const commandScrollTimers = new WeakMap();
  const live = document.createElement("span");
  live.className = "ops-sr";
  live.setAttribute("aria-live", "polite");
  root.after(live);

  function powershellCommand() {
    const pipe = model.settings.systemDefault ? "openssh-ssh-agent" : "opssh-agent-0123456789abcdef";
    return "$env:SSH_AUTH_SOCK = '\\\\.\\pipe\\" + pipe + "'";
  }

  function renderCacheCard(glyph, label, description, prefix) {
    const settings = model.settings;
    const mode = settings[`${prefix}Mode`];
    const modes = { off: '不缓存', fixed: '固定时长', idle: '空闲超时', 'until-exit': '直到 opssh 退出' };
    const hints = {
      off: prefix === "key" ? "私钥仅用于当前请求，完成后释放。" : "每次请求单独批准。",
      fixed: "从缓存建立时开始计时。",
      idle: "在指定时长内未使用时清除。",
      "until-exit": prefix === "key" ? "退出时清除，也可手动清除。" : "进程有效期间保留，可提前撤销，退出时清除。"
    };
    return `<section class="ops-rows ops-cache-card" aria-labelledby="ops-cache-title-${prefix}">
      <div class="ops-cache-head">${icon(glyph)}<div><h3 id="ops-cache-title-${prefix}">${label}</h3>${quiet(description)}</div></div>
      <div class="ops-cache-grid">
        <label class="ops-field ops-cache-mode"><span>保留方式</span>
          ${select(`${label}模式`, `cache:${prefix}Mode`, modes, mode)}
        </label>
        ${timed(mode) ? `<label class="ops-field ops-cache-duration">
          <span>时长（秒）</span>
          <input type="text" inputmode="numeric" pattern="[0-9]+" maxlength="7"
            aria-label="${label}时长（秒）" data-action="cache:${prefix}Seconds"
            aria-describedby="ops-cache-error-${prefix}"
            value="${esc(settings[`${prefix}Seconds`])}">
          <small id="ops-cache-error-${prefix}" class="ops-cache-error" role="status" hidden></small>
        </label>` : ""}
      </div>
      <p class="ops-quiet ops-cache-hint">${hints[mode]}</p>
    </section>`;
  }

  function renderSettings() {
    const settings = model.settings;
    return `<div class="ops-stack">
      ${heading('设置', '管理启动、SSH 集成、缓存、日志和显示偏好。更改后立即生效。')}
      <section class="ops-setting-group" aria-labelledby="ops-startup-heading">
        <h2 id="ops-startup-heading">启动</h2>
        <div class="ops-rows">
          ${row('power', '登录 Windows 时启动', '登录后在系统托盘中启动 opssh。', toggle('登录 Windows 时启动', 'startup', settings.startup))}
          ${row('timer', '等待 1Password 启动', '1Password 就绪时发送 Windows 通知。点击通知后可选择要授权的账户。', toggle('等待 1Password 启动', 'wait-password', settings.waitForPassword))}
        </div>
      </section>
      <section class="ops-setting-group" aria-labelledby="ops-ssh-heading">
        <h2 id="ops-ssh-heading">SSH 集成</h2>
        <div class="ops-rows">
          ${row('plug', '设为系统默认 SSH 代理', '让使用系统默认代理的 Windows SSH 客户端连接到 opssh。', toggle('设为系统默认 SSH 代理', 'system-default', settings.systemDefault))}
          ${row('terminal', '当前 PowerShell 会话', '在当前 PowerShell 中运行命令，将会话指向 opssh 的监听管道。',
            button('复制命令', 'copy-command', { glyph: 'copy' }),
            `<pre class="ops-code" data-powershell-command><code>${esc(powershellCommand())}</code></pre><p data-copy-status class="ops-quiet" hidden></p>`)}
        </div>
      </section>
      <section class="ops-setting-group" aria-labelledby="ops-cache-heading">
        <h2 id="ops-cache-heading">缓存策略</h2>
        <div class="ops-cache-list">
          ${renderCacheCard('key-round', '私钥缓存', '控制已加载的私钥在内存中保留多久。', 'key')}
          ${renderCacheCard('shield-check', '批准缓存', '控制进程批准可重复使用的时长。', 'approval')}
        </div>
      </section>
      <section class="ops-setting-group" aria-labelledby="ops-logs-heading">
        <h2 id="ops-logs-heading">日志</h2>
        <div class="ops-rows">
          ${row('folder-open', '日志目录', '<code>logs\\</code>', button('打开目录', 'open-logs', { glyph: 'external-link' }))}
          ${row('file-text', '启用日志', '记录运行阶段、耗时和结果，用于排查问题。', toggle('启用日志', 'logging', settings.logging))}
          ${row('list-filter', '日志级别', settings.logging ? '默认级别为 INFO。' : '启用日志后可更改。', select('日志级别', 'log-level',
            { ERROR: 'ERROR', WARN: 'WARN', INFO: 'INFO', DEBUG: 'DEBUG' }, settings.logLevel, { disabled: !settings.logging }))}
          ${row('hard-drive', '日志占用空间', '', `<div class="ops-inline-actions"><span class="ops-mono">${model.logsUsed ? "1.4 MB" : "0 B"}</span>
            ${button('清理日志', 'clear-logs', { disabled: !model.logsUsed, glyph: 'trash-2' })}</div>`)}
        </div>
      </section>
      <section class="ops-setting-group" aria-labelledby="ops-appearance-heading">
        <h2 id="ops-appearance-heading">偏好</h2>
        <div class="ops-rows">
          ${row('palette', '主题', '选择应用窗口和批准提示的外观。', select('主题', 'theme', { system: '跟随系统', light: '浅色', dark: '深色' }, settings.theme))}
          ${row('languages', '语言', '选择设置、批准提示和托盘菜单的显示语言。', select('语言', 'language', { system: '跟随系统', 'zh-Hans': '简体中文', en: 'English' }, settings.language))}
        </div>
      </section>
    </div>`;
  }

  function renderAbout() {
    const settings = model.settings;
    const github = '<a class="ops-link" href="https://github.com/Cirnouo/opssh" target="_blank" rel="noopener noreferrer">Cirnouo/opssh</a>';
    return `<div class="ops-stack">
      ${heading('关于', '')}
      <div class="ops-about-brand">
        <span class="ops-app-icon" aria-hidden="true">${icon('terminal')}</span>
        <div>
          <h2>opssh</h2>
          <p class="ops-quiet">使用存储在 1Password 中的密钥，为 Windows SSH 客户端提供签名。</p>
        </div>
      </div>
      <section class="ops-setting-group" aria-labelledby="ops-updates-heading">
        <h2 id="ops-updates-heading">版本和更新</h2>
        <div class="ops-rows">
          ${row('package', '当前版本', 'Windows x64', '<span class="ops-mono">0.1.0</span>')}
          ${row('refresh-cw', '检查更新', esc(model.updateStatus || '在 GitHub 上查找更新的正式发行版。'),
            button(model.updateChecking ? '检查中…' : '检查更新', 'check-update', { disabled: model.updateChecking }))}
          ${row('download', '启动时自动检查更新', '每次启动 opssh 时检查一次，发现新版时通知你。', toggle('启动时自动检查更新', 'auto-update', settings.autoUpdate))}
        </div>
      </section>
      <section class="ops-setting-group" aria-labelledby="ops-project-heading">
        <h2 id="ops-project-heading">项目信息</h2>
        <div class="ops-rows">
          ${row('user-round', '开发者', '', '<span>Cirnouo</span>')}
          ${row('scale', '许可证', '', '<span>Apache License 2.0</span>')}
          ${row('github', 'GitHub', '查看源代码和发行版。', github)}
        </div>
      </section>
    </div>`;
  }

  function renderKeys() {
    const keys = model.hasDiscovered ? model.keys : [];
    const mayDiscover = model.allowedVaults.size > 0;
    const scan = model.scan;
    const actions = scan ? button('取消发现', 'cancel-discovery') :
      button('发现 SSH 密钥', 'discover', { primary: true, disabled: !mayDiscover || Boolean(model.vaultChange), glyph: 'search' });
    const bulkActions = `<div class="ops-actions" role="group" aria-label="批量操作">
      ${button('预加载全部私钥', 'preload-all', {
        disabled: Boolean(scan) || !mayDiscover || model.settings.keyMode === "off" || !keys.some((key) => !model.loaded.has(key.id)),
        glyph: 'download'
      })}
      ${button('清除已加载私钥', 'evict-all', { disabled: model.loaded.size === 0, glyph: 'package-minus' })}
      ${button('撤销全部授权', 'revoke-all', { disabled: model.grants.length === 0, glyph: 'shield-x' })}
    </div>`;
    const status = !mayDiscover ? info('请在 1Password 页面选择允许发现 SSH 密钥的保险库。')
      : model.settings.keyMode === "off" ? info('私钥缓存设为「不缓存」。签名时会临时读取私钥。') : '';
    const empty = !model.hasDiscovered
      ? '运行“发现 SSH 密钥”以建立密钥列表。'
      : '已完成发现。所选保险库中没有 SSH 密钥。';

    return `<div class="ops-stack">
      ${heading('SSH 密钥', '发现密钥、管理预加载状态和进程授权。', actions)}
      ${scan ? `<div class="ops-rows ops-scan" role="status">
        <div class="ops-section-head"><strong>${scan.phase === "vaults" ? "正在扫描保险库" : "正在读取 SSH 公钥"}</strong>
          ${scan.phase === "vaults" ? `<small class="ops-quiet">${scan.completed} / ${scan.vaults.length}</small>` : ""}</div>
        ${scan.phase === "vaults" ? `<progress value="${scan.completed}" max="${scan.vaults.length}" aria-label="已扫描保险库"></progress>` : '<progress aria-label="正在读取 SSH 公钥"></progress>'}
      </div>` : ""}
      ${status}
      <div class="ops-key-counts" aria-label="SSH 密钥统计">
        <span><strong>${keys.length}</strong> 把公钥</span><span><strong>${model.grants.length}</strong> 项进程授权</span>
      </div>
      ${bulkActions}
      ${keys.length ? renderKeyTable(keys) : `<p class="ops-empty">${empty}</p>`}
    </div>`;
  }

  function renderKeyTable(keys) {
    return `<div class="ops-table-wrap">
      <table class="ops-table ops-key-table" aria-label="SSH 密钥">
        <colgroup><col class="ops-col-key"><col class="ops-col-loaded"><col class="ops-col-approval"><col class="ops-col-actions"></colgroup>
        <thead><tr>
          <th scope="col">密钥</th>
          <th scope="col">私钥加载状态</th>
          <th scope="col">进程授权</th>
          <th scope="col">操作</th>
        </tr></thead>
        <tbody>${keys.map(renderKeyRow).join('')}</tbody>
      </table>
    </div>`;
  }

  function renderKeyRow(key) {
    const keyGrants = model.grants.filter((grant) => grant.keyId === key.id);
    const isLoaded = model.loaded.has(key.id);
    const isExpanded = model.expanded.has(key.id);
    const id = esc(key.id);
    const name = esc(key.name);
    const toggleLabel = `${isExpanded ? '收起' : '展开'} ${name} 的进程授权（${keyGrants.length} 项）`;
    const toggle = `<button type="button" class="ops-button ops-key-expand ops-grant-toggle" data-action="expand:${id}"
      aria-label="${toggleLabel}" aria-expanded="${isExpanded}"${isExpanded ? ` aria-controls="ops-grants-${id}"` : ''}>
      ${icon(isExpanded ? 'chevron-down' : 'chevron-right')}<span>${keyGrants.length} 项</span>
    </button>`;

    return `<tr class="ops-key-row">
      <th scope="row" data-label="密钥">
        <div class="ops-key-id">
          <span>${name}</span>
          <span class="ops-quiet">${esc(key.vault)}</span>
          <span class="ops-quiet ops-mono">${esc(key.fingerprint)}</span>
        </div>
      </th>
      <td data-label="私钥加载状态">${metricState(isLoaded ? '已加载' : '未加载', isLoaded ? 'success' : 'neutral')}</td>
      <td data-label="进程授权">${toggle}</td>
      <td data-label="操作"><div class="ops-row-actions">
        ${button('预加载私钥', `preload:${key.id}`, {
          disabled: Boolean(model.scan) || isLoaded || model.settings.keyMode === "off" || model.allowedVaults.size === 0,
          labelFor: `预加载 ${key.name} 的私钥`
        })}
        ${button('清除私钥缓存', `evict:${key.id}`, {
          disabled: !isLoaded,
          labelFor: `清除 ${key.name} 已加载的私钥`
        })}
        ${button('撤销该密钥授权', `revoke-key:${key.id}`, {
          disabled: keyGrants.length === 0,
          labelFor: `撤销授权（${key.name} 的全部授权）`
        })}
      </div></td>
    </tr>${isExpanded ? `<tr class="ops-expanded">
      <td colspan="4"><div class="ops-grant-pane" id="ops-grants-${id}">
        ${renderGrantTable(key, keyGrants)}
      </div></td>
    </tr>` : ''}`;
  }

  function renderGrantTable(key, keyGrants) {
    if (!keyGrants.length) return '<p class="ops-empty">此密钥暂无进程授权。</p>';

    return `<table class="ops-table ops-grant-table" aria-label="${esc(key.name)} 的进程授权">
      <colgroup><col class="ops-col-process"><col class="ops-col-pid"><col class="ops-col-time"><col class="ops-col-actions"></colgroup>
      <thead><tr>
        <th scope="col">进程名称</th>
        <th scope="col">PID</th>
        <th scope="col">到期时间（本地）</th>
        <th scope="col">操作</th>
      </tr></thead>
      <tbody>${keyGrants.map((grant) => `<tr>
        <th scope="row" data-label="进程名称" class="ops-mono">${esc(grant.process)}</th>
        <td data-label="PID" class="ops-mono">${esc(grant.pid)}</td>
        <td data-label="到期时间（本地）" class="ops-mono"><time datetime="${new Date(grant.expires).toISOString()}">${esc(localTime(grant.expires))}</time></td>
        <td data-label="操作">${button('撤销此授权', `revoke-grant:${grant.id}`, {
          labelFor: `撤销 ${grant.process}（PID ${grant.pid}）对 ${key.name} 的授权`
        })}</td>
      </tr>`).join('')}</tbody>
    </table>`;
  }

  function renderActivity() {
    const groups = [
      { id: 'process', label: '应用名称', value: entry => entry.process },
      { id: 'key', label: '密钥名称', value: entry => entry.key || '—' },
      { id: 'result', label: '结果', value: entry => entry.result },
      { id: 'day', label: '本地日期', value: entry => localTime(entry.time).slice(0, 10) }
    ];
    const activity = model.activity;
    const filters = model.activityFilters;
    const entries = activity.filter(entry => groups.every(({ id, value }) =>
      filters[id].size === 0 || filters[id].has(value(entry))));
    const clearAction = button('清除活动', 'clear-activity', {
      disabled: activity.length === 0,
      glyph: 'trash-2'
    });
    const reset = button('重置筛选', 'filter-reset', {
      disabled: groups.every(({ id }) => filters[id].size === 0)
    });
    return `<div class="ops-stack ops-activity-page">
      ${heading('活动', '查看应用的 SSH 请求结果。', clearAction)}
      <div class="ops-activity-filters" role="group" aria-label="活动筛选">
        ${groups.map(group => renderActivityFilter(group, activity)).join('')}
        ${reset}
      </div>
      <p class="ops-activity-count" role="status">共 ${activity.length} 条 · 显示 ${entries.length} 条</p>
      ${renderActivityTable(entries)}
    </div>`;
  }

  function renderActivityFilter({ id, label, value }, activity) {
    const selected = model.activityFilters[id];
    const open = model.activityFilterOpen === id;
    const choices = [...new Set(activity.map(value))];
    if (id === 'day') choices.sort().reverse();
    else choices.sort((first, second) => first.localeCompare(second));
    const menuId = `ops-activity-filter-${id}`;
    return `<div class="ops-activity-filter">
      <button type="button" class="ops-button ops-activity-filter-button" data-action="filter-open:${id}"
        data-filtered="${selected.size > 0}" aria-expanded="${open}"${open ? ` aria-controls="${menuId}"` : ''}
        ${choices.length ? '' : 'disabled'}${selected.size ? ` data-tooltip="${esc([...selected].join('、'))}"` : ''}>
        <span>${label}${selected.size ? ` (${selected.size})` : ''}</span>${icon('chevron-down')}
      </button>
      ${open ? `<div class="ops-activity-filter-menu" id="${menuId}" role="group" aria-label="${label}">
        ${choices.map(choice => `<label class="ops-activity-filter-option">
          <input type="checkbox" data-action="filter:${id}" value="${esc(choice)}"${selected.has(choice) ? ' checked' : ''}>
          <span>${esc(choice)}</span>
        </label>`).join('')}
      </div>` : ''}
    </div>`;
  }

  function renderActivityTable(entries) {
    if (!entries.length) {
      const message = model.activity.length ? '没有符合当前筛选条件的活动。' : '暂无 SSH 活动。';
      return `<p class="ops-empty">${message}</p>`;
    }

    return `<div class="ops-table-wrap ops-activity-scroll" role="region" aria-label="SSH 活动列表">
      <table class="ops-table ops-activity-table" aria-label="SSH 活动">
        <colgroup><col class="ops-col-process"><col class="ops-col-key"><col class="ops-col-result"><col class="ops-col-time"></colgroup>
        <thead><tr>
          <th scope="col">应用</th>
          <th scope="col">密钥</th>
          <th scope="col">结果</th>
          <th scope="col">时间（本地）</th>
        </tr></thead>
        <tbody>${entries.map(entry => `<tr>
          <th scope="row" data-label="应用">
            <div class="ops-activity-app"><strong>${esc(entry.process)}</strong><small class="ops-mono ops-quiet">PID ${esc(entry.appPid ?? '—')}</small></div>
            <code class="ops-activity-command ops-mono" aria-label="SSH 请求命令">${esc(entry.command || '—')}</code>
          </th>
          <td data-label="密钥">${esc(entry.key || '—')}</td>
          <td data-label="结果">${renderActivityResult(entry.result)}</td>
          <td data-label="时间（本地）" class="ops-mono"><time datetime="${new Date(entry.time).toISOString()}">${esc(localTime(entry.time))}</time></td>
        </tr>`).join('')}</tbody>
      </table>
    </div>`;
  }

  function renderActivityResult(result) {
    const tone = ['已签名', '签名成功', '已允许', '允许'].includes(result) ? 'success'
      : ['已拒绝', '拒绝', '签名失败', '失败'].includes(result) ? 'danger'
      : 'neutral';
    return metricState(result, tone);
  }

  function renderAccount() {
    const request = model.lastDesktopRequest;
    const outcomes = { success: ["上次访问成功", "success"], denied: ["上次访问未获授权", "warning"], failure: ["上次访问失败", "danger"] };
    const requestStatus = request ? `<div class="ops-request-status">
      ${metricState(...outcomes[request.outcome])}
      <time class="ops-mono" datetime="${new Date(request.at).toISOString()}" aria-label="上次请求时间（本地）">${esc(localTime(request.at))}</time>
    </div>` : metricState("尚未请求");
    const scopeHint = !model.allowedVaults.size ? "选择至少一个保险库，再前往 SSH 密钥手动发现。" :
      "新增保险库中的公钥会在下次手动发现后出现。";
    return `<div class="ops-stack">
      ${heading("1Password 账户", "管理已选账户和用于发现 SSH 密钥的保险库。")}
      ${model.showPickerNotice ? renderPickerNotice() : ""}
      <div class="ops-rows">
        ${row("user-round", "已选账户", esc(accountLabel(model.account)), `<div class="ops-actions">
          ${button("切换账户", "switch-account")}${button("移除账户", "logout", { labelFor: "移除当前账户" })}
        </div>`)}
        ${row("shield", "1Password 访问记录", "需要访问时，1Password 可能要求重新授权。", requestStatus)}
      </div>
      <section class="ops-setting-group">
        <div class="ops-section-head"><h2>允许发现的保险库</h2><div class="ops-inline-actions">
          <small class="ops-quiet">已允许 ${model.allowedVaults.size} 个</small>${button("刷新保险库", "reload-vaults", { glyph: "refresh-cw", disabled: Boolean(model.vaultChange) })}</div></div>
        ${quiet("权限更改立即生效。只从允许的保险库发现 SSH 密钥。")}
        <div class="ops-rows">${vaults.map(vault => {
          const saving = model.vaultChange?.id === vault.id;
          const failed = model.vaultError?.id === vault.id;
          const retry = failed ? `<div class="ops-row-note"><small class="ops-row-error" role="alert">更改未保存，已恢复上次设置。</small>${textButton("重试", `retry-vault:${vault.id}`)}</div>` : "";
          return row("vault", vault.name, saving ? "正在保存…" : "", toggle(`允许 ${vault.name} 保险库`, `vault:${vault.id}`,
            saving ? model.vaultChange.enabled : model.allowedVaults.has(vault.id), { disabled: Boolean(model.vaultChange) }), retry);
        }).join("")}</div>
        ${model.allowedVaults.size ? `<div class="ops-actions">${textButton("前往 SSH 密钥", "nav:keys")}</div>` : ""}
        ${quiet(scopeHint)}
      </section>
    </div>`;
  }

  function renderSignedOut() {
    return `<div class="ops-login">
      ${appIcon("key-round")}
      <h1>连接 1Password</h1>
      ${model.showPickerNotice ? "" : quiet("在 1Password 桌面应用登录后，连接账户即可管理 SSH 密钥。")}
      ${model.showPickerNotice ? renderPickerNotice() : button("连接 1Password", "login", { primary: true })}
    </div>`;
  }

  function renderPickerNotice() {
    if (model.pickerStatus === "checking") return '<p class="ops-quiet" role="status">正在查找此设备上的 1Password 账户…</p>';
    const message = model.pickerStatus === "missing"
      ? "未找到 1Password CLI。安装并在 1Password 中启用 CLI 集成后，点击重试。"
      : model.pickerStatus === "no-other" ? "没有其他可切换的账户。请先在 1Password 桌面应用中登录另一个账户。"
      : "1Password 桌面应用中没有已登录的账户。登录后重试。";
    return `<div class="ops-stack ops-account-notice" role="status">
      ${info(message, { kind: "warning" })}
      <div class="ops-actions">${button("重试", "retry-picker", { primary: true })}</div>
    </div>`;
  }

  function renderToast() {
    if (!model.toast) return "";
    return `<aside class="ops-toast ops-stack" aria-label="Windows 通知演示">
      <div class="ops-section-head"><span class="ops-title">${appIcon("terminal")} opssh</span>${iconButton("关闭通知", "toast-no", "x")}</div>
      <div><strong>1Password 已就绪</strong>${quiet("选择要授权的 1Password 账户。")}${model.account ? quiet(`当前账户为 ${esc(accountLabel(model.account))}。`) : ""}</div>
      <div class="ops-actions">${button("选择账户", "toast-yes", { primary: true })}${button("稍后", "toast-no")}</div>
    </aside>`;
  }

  function renderDialog() {
    let title;
    let detail;
    let action;
    if (model.dialog === "login") {
      title = model.pickerIntent === "authorize" ? "选择要授权的 1Password 账户"
        : model.pickerIntent === "switch" ? "切换 1Password 账户" : "连接 1Password 账户";
      detail = `<label class="ops-field ops-picker-account">账户
          ${select("选择 1Password 账户", "choose-account", eligibleAccounts(), model.accountChoice)}</label>
          ${quiet("继续后，1Password 可能会提示为此账户授权。")}`;
      action = button("在 1Password 中继续", "login-start", { primary: true });
    } else if (model.dialog === "authorize") {
      title = "1Password 授权";
      detail = `<p>为 <strong>${esc(accountLabel(model.accountChoice))}</strong> 请求授权。</p>${model.connected && model.accountChoice !== model.account
        ? "<p>新账户授权后会清除旧账户的保险库范围、密钥、授权和活动。</p>"
        : quiet("真实验证会在 1Password 窗口完成。")}`;
      action = button("模拟批准", "authorize", { primary: true });
    } else if (model.dialog === "logout") {
      title = "移除 opssh 中的账户？";
      detail = `<p>将清除 <strong>${esc(accountLabel(model.account))}</strong> 在 opssh 中的保险库范围、公钥索引、私钥缓存、进程授权和活动。</p>`;
      action = button("移除账户", "confirm-logout", { primary: true });
    } else if (model.dialog === "clear-logs") {
      title = "清理诊断日志？";
      detail = "<p>删除现有日志文件，释放 1.4 MB 空间。启用日志时，后续操作仍会写入新日志。</p>";
      action = button("清理日志", "confirm-clear-logs", { primary: true });
    } else if (model.dialog === "open-logs") {
      title = "日志目录";
      detail = `<p><code>logs\\</code></p>${model.logsUsed
        ? '<ul class="ops-dialog-log-files" aria-label="日志文件"><li><code>opssh.log</code><span>384 KB</span></li><li><code>opssh.1.log</code><span>1.0 MB</span></li></ul>'
        : quiet("目录中没有日志文件。")}`;
      return `<dialog class="ops-dialog" aria-labelledby="ops-dialog-title"><div class="ops-stack">
        <h2 id="ops-dialog-title">${title}</h2>${detail}<div class="ops-actions">${button("关闭", "cancel-dialog")}</div>
      </div></dialog>`;
    } else if (model.dialog === "system-default") {
      const enabling = !model.settings.systemDefault;
      title = enabling ? "设为系统默认 SSH 代理？" : "恢复 Windows OpenSSH 代理？";
      detail = enabling ?
        "<p>如果 OpenSSH 代理服务设为自动且正在运行，将停止并禁用该服务，然后让 opssh 监听 Windows OpenSSH 的默认管道。</p>" :
        "<p>opssh 将切回专用管道。如果 OpenSSH 代理服务未设为自动，将改为自动。如果服务尚未运行，将启动它。</p>";
      return `<dialog class="ops-dialog" aria-labelledby="ops-dialog-title"><div class="ops-stack">
        <h2 id="ops-dialog-title">${title}</h2><div data-agent-description>${detail}</div>
        <section class="ops-agent-progress" aria-label="切换进度" data-agent-progress hidden></section>
        <div class="ops-actions" data-agent-actions>${button(enabling ? "设为默认" : "恢复 OpenSSH", "confirm-default", { primary: true })}${button("取消", "cancel-dialog")}</div>
      </div></dialog>`;
    } else if (model.dialog === "clear-activity") {
      title = "清除活动？";
      detail = "<p>清除列表中的 SSH 请求记录。</p>";
      action = button("清除活动", "confirm-clear", { primary: true });
    } else {
      return "";
    }
    return `<dialog class="ops-dialog" aria-labelledby="ops-dialog-title"><div class="ops-stack">
      <h2 id="ops-dialog-title">${title}</h2>${detail}
      <div class="ops-actions">${action}${button("取消", "cancel-dialog")}</div>
    </div></dialog>`;
  }

  function navItem(page, current) {
    const [label, glyph] = pages[page];
    const inactive = !model.connected && (page === "keys" || page === "activity");
    return `<li><button type="button" class="ops-nav" data-action="nav:${page}" aria-label="${label}"${current ? ' aria-current="page"' : ""}${inactive ? " disabled" : ""}>
      ${icon(glyph)}<span>${label}</span>
    </button></li>`;
  }

  function draw(focusAction, focusValue) {
    const samePage = renderedPage === model.page;
    const filterChanged = focusAction?.startsWith("filter:") || focusAction === "filter-reset";
    const mainTop = samePage ? root.querySelector(".ops-main")?.scrollTop : 0;
    const activityScroll = samePage ? root.querySelector(".ops-activity-scroll") : null;
    const activityTop = filterChanged ? 0 : activityScroll?.scrollTop;
    const activityLeft = activityScroll?.scrollLeft;
    const filterTop = samePage && focusAction?.startsWith("filter:") ? root.querySelector(".ops-activity-filter-menu")?.scrollTop : 0;
    const signedOut = !model.connected && !["settings", "about"].includes(model.page);
    const content = signedOut ? renderSignedOut() : ({
      account: renderAccount, keys: renderKeys, activity: renderActivity,
      settings: renderSettings, about: renderAbout
    })[model.page]();
    root.dataset.theme = model.settings.theme;
    root.innerHTML = `<div class="ops-window">
      <header class="ops-titlebar">
        <span class="ops-title">${appIcon("terminal")}<span>opssh</span></span>
        <span class="ops-caption" aria-hidden="true"><span class="ops-min"></span><span class="ops-max"></span><span class="ops-close"></span></span>
      </header>
      <div class="ops-layout" data-pane="${model.pane}">
        <nav class="ops-sidebar" aria-label="opssh 导航">
          ${iconButton("切换导航窗格", "pane", "menu")}
          <ul>${["keys","activity","account"].map(page => navItem(page, page === model.page)).join("")}</ul>
          <ul>${["settings","about"].map(page => navItem(page, page === model.page)).join("")}</ul>
        </nav>
        <div class="ops-surface${signedOut ? " ops-signedout" : ""}">
          ${!signedOut && model.message ? `<div class="ops-feedback">${info(esc(model.message), { kind: model.messageKind, dismissible: true })}</div>` : ""}
          <main class="ops-main">${content}</main>
        </div>
      </div>
      ${renderToast()}${renderDialog()}
    </div>`;
    renderedPage = model.page;
    for (const [selector, top] of [[".ops-main", mainTop], [".ops-activity-scroll", activityTop], [".ops-activity-filter-menu", filterTop]]) {
      const element = root.querySelector(selector);
      if (element && top) element.scrollTop = top;
    }
    const activityTable = root.querySelector(".ops-activity-scroll");
    if (activityTable && activityLeft) activityTable.scrollLeft = activityLeft;
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
    const dialog = root.querySelector("dialog");
    if (dialog) {
      dialog.addEventListener("cancel", event => {
        event.preventDefault();
        if (model.agentTransition?.running) return;
        draw(click("cancel-dialog"));
      });
      dialog.showModal();
    }
    if (focusAction) {
      const targetAction = focusAction === "filter-reset" ? "filter-open:process" : focusAction;
      const target = [...(dialog || root).querySelectorAll("[data-action]")].find(control =>
        control.dataset.action === targetAction && !control.disabled && (focusValue === undefined || control.value === focusValue));
      target?.focus({ preventScroll: true });
    }
    live.textContent = model.message || (model.page === "about" ? model.updateStatus : "");
  }

  function notify(message, kind = "info") {
    model.message = message;
    model.messageKind = kind;
  }

  function eligibleAccounts() {
    return Object.fromEntries(Object.entries(model.availableAccounts).filter(([id]) => model.pickerIntent !== "switch" || id !== model.account));
  }

  function openAccountPicker(intent = model.pickerIntent) {
    model.pickerIntent = intent;
    const first = Object.keys(eligibleAccounts())[0];
    model.accountChoice = first || "";
    model.showPickerNotice = !first;
    if (!first) {
      model.dialog = "";
      if (model.pickerStatus === "ready") model.pickerStatus = intent === "switch" ? "no-other" : "empty";
      return "retry-picker";
    }
    model.dialog = "login";
    return "choose-account";
  }

  function retryAccountPicker() {
    const current = model;
    const previous = current.pickerStatus;
    current.pickerStatus = "checking";
    setTimeout(() => {
      if (model !== current) return;
      if (current.installOnRetry) {
        current.installOnRetry = false;
        current.availableAccounts = accountChoices;
        current.pickerStatus = "ready";
      } else {
        current.pickerStatus = previous;
      }
      draw(openAccountPicker());
    }, 650);
  }

  function paintAgentTransition(dialog, transition) {
    const phaseText = { running: "进行中", done: "完成", skipped: "跳过", failed: "失败", pending: "待确认" };
    const phaseIcon = { done: "circle-check", skipped: "minus", failed: "circle-x", pending: "triangle-alert" };
    const progress = dialog.querySelector("[data-agent-progress]");
    progress.hidden = false;
    progress.innerHTML = `<ol class="ops-agent-steps" aria-label="切换步骤">${transition.rows.map(item => `
      <li data-phase="${item.phase}"${item.phase === "running" ? ' aria-current="step"' : ""}>
        ${item.phase === "running" ? '<span class="ops-agent-spin" aria-hidden="true"></span>' : icon(phaseIcon[item.phase])}
        <div><strong>${esc(item.title)}</strong>${item.detail ? quiet(esc(item.detail)) : ""}</div>
        <small class="ops-quiet">${phaseText[item.phase]}</small>
      </li>`).join("")}</ol>
      ${transition.summary ? info(esc(transition.summary), { kind: transition.result === "success" ? "info" : "warning" }) : ""}`;
    const actions = dialog.querySelector("[data-agent-actions]");
    actions.innerHTML = transition.running ? "" : button("关闭", "cancel-dialog", { primary: true });
    live.textContent = transition.summary || `${transition.rows.at(-1).title}，进行中。`;
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
    if (!transition.running) actions.querySelector("button").focus({ preventScroll: true });
    dialog.scrollTop = dialog.scrollHeight;
  }

  function beginAgentTransition() {
    const current = model;
    const dialog = root.querySelector("dialog");
    if (current.agentTransition || !dialog) return;
    const enable = !current.settings.systemDefault;
    const demoOutcome = preview.defaultOutcome;
    const serviceAbsent = demoOutcome === "service-absent";
    const inspect = [enable ? "检查 OpenSSH 服务和默认 SSH 管道" : "检查 Windows OpenSSH 代理服务", serviceAbsent ? "未找到 OpenSSH 代理服务。" :
      enable ? "服务正在运行，启动类型为自动。已检查默认管道。" : "服务已停止，启动类型为禁用。"];
    const pipe = enable ? ["为 opssh 取得默认 SSH 管道", "opssh 已开始监听默认管道。"] :
      ["释放默认 SSH 管道", "opssh 已切回专用管道。"];
    const save = ["保存并验证代理设置", "已保存选择，已确认监听状态。"];
    const serviceSteps = enable ? [
      ["停止 Windows OpenSSH 代理服务", "服务已停止。"],
      ["禁用 Windows OpenSSH 代理服务", "启动类型已设为禁用。"]
    ] : [
      ["将 Windows OpenSSH 代理设为自动启动", "启动类型已设为自动。"],
      ["启动 Windows OpenSSH 代理服务", "服务正在运行。"]
    ];
    if (serviceAbsent) serviceSteps.forEach(step => step[2] = true);
    const steps = enable ? [inspect, ...serviceSteps, pipe, save] : [inspect, pipe, ...serviceSteps, save];
    const transition = { rows: [], running: true, result: "", summary: "" };
    current.agentTransition = transition;
    dialog.querySelector("h2").textContent = enable ? "设为系统默认 SSH 代理" : "恢复 Windows OpenSSH 代理";
    dialog.querySelector("[data-agent-description]").hidden = true;
    dialog.focus({ preventScroll: true });

    function finish(result, summary) {
      transition.running = false;
      transition.result = result;
      transition.summary = summary;
      if (result === "success") {
        current.settings.systemDefault = enable;
        const control = root.querySelector('input[data-action="system-default"]');
        control.checked = enable;
        control.nextElementSibling.textContent = enable ? "开" : "关";
      }
      paintAgentTransition(dialog, transition);
    }

    function showStep(index) {
      if (model !== current || current.agentTransition !== transition || !dialog.open) return;
      const step = steps[index];
      if (!step) {
        finish("success", enable ? "设置完成。opssh 现为系统默认 SSH 代理。" :
          serviceAbsent ? "设置完成。opssh 已切回专用管道，Windows OpenSSH 代理服务不存在。" :
          "设置完成。已恢复 Windows OpenSSH 代理。");
        return;
      }
      const row = { title: step[0], detail: "", phase: "running" };
      transition.rows.push(row);
      if (step[2]) {
        row.phase = "skipped";
        row.detail = "系统未安装 Windows OpenSSH 代理服务。";
        showStep(index + 1);
        return;
      }
      paintAgentTransition(dialog, transition);
      setTimeout(() => {
        if (model !== current || current.agentTransition !== transition || !dialog.open) return;
        if (demoOutcome === "service-pending" && step === serviceSteps[0]) {
          row.phase = "pending";
          row.detail = "Windows 尚未确认服务操作的结果。";
          finish("pending", "已保留恢复记录。请先检查 Windows OpenSSH 代理服务状态。");
          return;
        }
        if (demoOutcome === "pipe-failure" && step === pipe) {
          row.phase = "failed";
          row.detail = enable ? "默认 SSH 管道已被占用。" : "无法释放默认 SSH 管道。";
          const rollback = { title: "恢复切换前的状态", detail: "", phase: "running" };
          transition.rows.push(rollback);
          paintAgentTransition(dialog, transition);
          setTimeout(() => {
            if (model !== current || current.agentTransition !== transition || !dialog.open) return;
            rollback.phase = "done";
            rollback.detail = "已确认原服务和管道状态。";
            finish("failed", "切换失败，已恢复原设置。");
          }, 850);
          return;
        }
        row.phase = "done";
        row.detail = step[1];
        showStep(index + 1);
      }, index === 0 ? 1250 : 850);
    }
    showStep(0);
  }

  function saveVault(id, enabled) {
    const current = model;
    if (current.vaultChange || current.scan || !vaults.some(vault => vault.id === id)) return;
    const change = { id, enabled };
    current.vaultChange = change;
    current.vaultError = null;
    setTimeout(() => {
      if (model !== current || current.vaultChange !== change) return;
      current.vaultChange = null;
      if (current.failNextVaultSave) {
        current.failNextVaultSave = false;
        current.vaultError = change;
        draw(`retry-vault:${id}`);
        return;
      }
      if (enabled) {
        current.allowedVaults.add(id);
        notify("已允许此保险库。请手动发现其中的公钥。");
      } else {
        current.allowedVaults.delete(id);
        current.keys = current.keys.filter(key => key.vaultId !== id);
        retainIndexedKeys();
        notify("已排除此保险库及其密钥和授权。");
      }
      draw(`vault:${id}`);
    }, 550);
  }

  function discoverKeys() {
    const current = model;
    if (current.scan || current.vaultChange || !current.allowedVaults.size) return;
    const scan = { vaults: [...current.allowedVaults], completed: 0, phase: "vaults" };
    current.scan = scan;
    notify("");
    const advance = () => {
      if (model !== current || current.scan !== scan) return;
      if (scan.phase === "vaults") {
        scan.completed += 1;
        if (scan.completed === scan.vaults.length) scan.phase = "public";
        draw();
        setTimeout(advance, 1050);
        return;
      }
      current.scan = null;
      recordDesktopRequest();
      current.keys = catalog.filter(key => scan.vaults.includes(key.vaultId));
      current.hasDiscovered = true;
      retainIndexedKeys();
      notify(`发现完成，已更新 ${current.keys.length} 把公钥。`);
      draw("discover");
    };
    setTimeout(advance, 950);
  }

  function retainIndexedKeys() {
    const ids = new Set(model.keys.map(key => key.id));
    model.loaded = new Set([...model.loaded].filter(id => ids.has(id)));
    model.grants = model.grants.filter(grant => ids.has(grant.keyId));
    model.expanded = new Set([...model.expanded].filter(id => ids.has(id)));
  }

  function resetAccountData() {
    model.scan = null;
    model.vaultChange = null;
    model.vaultError = null;
    model.allowedVaults.clear();
    model.keys = [];
    model.hasDiscovered = false;
    retainIndexedKeys();
    model.activity = [];
    model.activityFilters = emptyActivityFilters();
    model.activityFilterOpen = "";
  }

  async function copyPowerShellCommand() {
    const current = model;
    let copied = false;
    try {
      if (globalThis.navigator?.clipboard?.writeText) {
        await navigator.clipboard.writeText(powershellCommand());
        copied = true;
      }
    } catch {
      // The preview host can restrict clipboard access.
    }
    if (model !== current || model.page !== "settings") return;
    if (!copied) {
      const command = root.querySelector("[data-powershell-command]");
      const selection = globalThis.getSelection?.();
      if (command && selection) {
        const range = document.createRange();
        range.selectNodeContents(command);
        selection.removeAllRanges();
        selection.addRange(range);
        try {
          copied = document.execCommand?.("copy") === true;
        } catch {
          // Keep the selection available for Ctrl+C.
        }
        if (!copied) {
          const status = root.querySelector("[data-copy-status]");
          status.textContent = "已选中命令，按 Ctrl+C 复制。";
          status.hidden = false;
          live.textContent = status.textContent;
          return;
        }
      }
    }
    notify(copied ? "已复制 PowerShell 命令。" : "剪贴板不可用，请手动选择并复制命令。", copied ? "info" : "warning");
    draw("copy-command");
  }

  function recordDesktopRequest() {
    model.lastDesktopRequest = { outcome: "success", at: Date.now() };
  }

  function setCachePolicy(field, value) {
    if (model.settings[field] === value) return;
    model.settings[field] = value;
    if (field.startsWith("key")) model.loaded.clear();
    else model.grants = [];
  }

  function commitCacheDuration(control, field) {
    const seconds = Number(control.value);
    const valid = /^\d+$/.test(control.value) && seconds >= 1 && seconds <= 2592000;
    const error = control.parentElement.querySelector(".ops-cache-error");
    control.setAttribute("aria-invalid", String(!valid));
    error.hidden = valid;
    error.textContent = valid ? "" : "请输入 1 到 2,592,000 之间的整数。";
    if (valid) {
      control.value = String(seconds);
      setCachePolicy(field, control.value);
    }
  }

  async function checkForUpdates() {
    const current = model;
    if (current.updateChecking) return;
    current.updateChecking = true;
    current.updateStatus = "正在检查更新…";
    try {
      await new Promise(resolve => setTimeout(resolve, 800));
      current.updateStatus = "演示结果：当前已是最新版本。";
    } catch {
      current.updateStatus = "演示结果：检查失败，可重试。";
    } finally {
      current.updateChecking = false;
      if (model === current && current.page === "about") {
        draw(document.activeElement?.dataset?.action);
      }
    }
  }

  function click(action) {
    const [verb, id] = action.split(":");
    switch (verb) {
      case "nav":
        model.page = id;
        model.activityFilterOpen = "";
        notify("");
        if (model.pane === "expanded" && matchMedia("(max-width: 620px)").matches) model.pane = "auto";
        break;
      case "pane": {
        const collapsed = model.pane === "collapsed" || (model.pane === "auto" && matchMedia("(max-width: 620px)").matches);
        model.pane = collapsed ? "expanded" : "collapsed";
        break;
      }
      case "dismiss": notify(""); break;
      case "login": return openAccountPicker("connect");
      case "switch-account": return openAccountPicker("switch");
      case "retry-picker": retryAccountPicker(); return "";
      case "login-start":
        if (!Object.hasOwn(eligibleAccounts(), model.accountChoice)) return openAccountPicker();
        model.dialog = "authorize";
        return "authorize";
      case "authorize": {
        const account = model.accountChoice;
        if (!account) return "choose-account";
        if (model.account !== account) resetAccountData();
        model.account = account;
        model.connected = true;
        recordDesktopRequest();
        model.page = "account";
        model.dialog = "";
        notify("已连接账户并列出保险库。请选择允许发现的保险库。");
        return "nav:account";
      }
      case "logout":
        model.dialog = "logout";
        return "cancel-dialog";
      case "reload-vaults":
        if (model.scan || model.vaultChange) return action;
        recordDesktopRequest();
        notify("保险库列表已更新。");
        return action;
      case "retry-vault":
        if (model.vaultError?.id === id) saveVault(id, model.vaultError.enabled);
        return action;
      case "confirm-logout":
        resetAccountData();
        model.account = "";
        model.accountChoice = "";
        model.connected = false;
        model.lastDesktopRequest = null;
        model.dialog = "";
        notify("");
        return "login";
      case "cancel-dialog": {
        const previous = model.dialog;
        model.dialog = "";
        if (previous === "system-default") model.agentTransition = null;
        if (previous === "system-default" || previous === "clear-activity" || previous === "logout") return previous;
        if (previous === "open-logs" || previous === "clear-logs") return previous;
        return model.connected ? "switch-account" : "login";
      }
      case "toast-yes":
        model.toast = false;
        return openAccountPicker("authorize");
      case "toast-no": model.toast = false; return "login";
      case "discover": discoverKeys(); return "cancel-discovery";
      case "cancel-discovery":
        model.scan = null;
        notify("已取消发现，保留上次结果。");
        return "discover";
      case "open-logs": model.dialog = "open-logs"; return "cancel-dialog";
      case "clear-logs": model.dialog = "clear-logs"; return "cancel-dialog";
      case "confirm-clear-logs":
        model.logsUsed = 0;
        model.dialog = "";
        notify("日志已清理。");
        return "open-logs";
      case "expand":
        if (model.expanded.has(id)) model.expanded.delete(id);
        else model.expanded.add(id);
        break;
      case "preload":
        if (model.scan) return action;
        recordDesktopRequest();
        model.loaded.add(id);
        notify("已预加载这把密钥的私钥。");
        return `evict:${id}`;
      case "evict":
        model.loaded.delete(id);
        notify("已清除这把密钥的私钥缓存。");
        return `preload:${id}`;
      case "preload-all":
        if (model.scan) return action;
        recordDesktopRequest();
        model.loaded = new Set(model.keys.map(key => key.id));
        notify("已预加载全部私钥。");
        break;
      case "evict-all":
        model.loaded.clear();
        notify(`已清除已加载的私钥。当前仍有 ${model.grants.length} 项进程授权。`);
        break;
      case "revoke-key":
        model.grants = model.grants.filter(grant => grant.keyId !== id);
        notify("已撤销这把密钥的全部进程授权。");
        return `expand:${id}`;
      case "revoke-grant": {
        const keyId = model.grants.find(grant => grant.id === id)?.keyId;
        model.grants = model.grants.filter(grant => grant.id !== id);
        notify("已撤销该进程的授权。");
        return `expand:${keyId}`;
      }
      case "revoke-all":
        model.grants = [];
        notify("已撤销全部进程授权。");
        break;
      case "filter-open":
        model.activityFilterOpen = model.activityFilterOpen === id ? "" : id;
        break;
      case "filter-reset":
        model.activityFilters = emptyActivityFilters();
        model.activityFilterOpen = "";
        break;
      case "clear-activity": model.dialog = "clear-activity"; return "cancel-dialog";
      case "confirm-clear":
        model.activity = [];
        model.activityFilters = emptyActivityFilters();
        model.activityFilterOpen = "";
        model.dialog = "";
        notify("活动已清除。");
        return "nav:activity";
      case "check-update": void checkForUpdates(); break;
    }
    return action;
  }

  function change(control) {
    const action = control.dataset.action;
    if (!action) return;
    const [verb, id] = action.split(":");
    switch (verb) {
      case "choose-account":
        if (Object.hasOwn(eligibleAccounts(), control.value)) model.accountChoice = control.value;
        break;
      case "filter":
        if (control.checked) model.activityFilters[id].add(control.value);
        else model.activityFilters[id].delete(control.value);
        return draw(action, control.value);
      case "vault": saveVault(id, control.checked); break;
      case "logging": model.settings.logging = control.checked; break;
      case "log-level":
        if (model.settings.logging && ["ERROR", "WARN", "INFO", "DEBUG"].includes(control.value)) model.settings.logLevel = control.value;
        break;
      case "startup": model.settings.startup = control.checked; break;
      case "wait-password": model.settings.waitForPassword = control.checked; break;
      case "system-default": model.dialog = "system-default"; return draw("cancel-dialog");
      case "theme": model.settings.theme = control.value; break;
      case "language":
        model.settings.language = control.value;
        notify("语言偏好已更新。预览文字使用简体中文。");
        break;
      case "auto-update": model.settings.autoUpdate = control.checked; break;
      case "cache":
        if (id.endsWith("Seconds")) return commitCacheDuration(control, id);
        setCachePolicy(id, control.value);
        break;
      default: return;
    }
    draw(action);
  }

  function moveHorizontally(element, delta, deltaMode) {
    const unit = deltaMode === 1 ? 16 : deltaMode === 2 ? element.clientWidth : 1;
    const before = element.scrollLeft;
    element.scrollLeft = before + Math.sign(delta) * Math.max(1, Math.abs(delta * unit));
    return element.scrollLeft !== before;
  }

  root.addEventListener("wheel", event => {
    if (!event.shiftKey || event.ctrlKey || !event.cancelable) return;
    const table = event.target.closest(".ops-activity-scroll");
    if (!table) return;
    const deltaMode = event.deltaMode;
    const delta = event.deltaX || event.deltaY;
    if (!Number.isFinite(delta) || delta === 0) return;
    const command = event.target.closest(".ops-activity-command");
    if (command && command.scrollWidth > command.clientWidth && moveHorizontally(command, delta, deltaMode)) {
      event.preventDefault();
      command.dataset.wheelScrolling = "";
      clearTimeout(commandScrollTimers.get(command));
      commandScrollTimers.set(command, setTimeout(() => {
        delete command.dataset.wheelScrolling;
        commandScrollTimers.delete(command);
      }, 700));
      return;
    }
    if (moveHorizontally(table, delta, deltaMode)) event.preventDefault();
  }, { passive: false });

  root.addEventListener("click", event => {
    const control = event.target.closest("button[data-action]");
    if (model.activityFilterOpen && !event.target.closest(".ops-activity-filter")) {
      model.activityFilterOpen = "";
      if (!control) return draw();
    }
    if (!control || control.disabled) return;
    if (control.dataset.action === "copy-command") {
      void copyPowerShellCommand();
      return;
    }
    if (control.dataset.action === "confirm-default") {
      beginAgentTransition();
      return;
    }
    draw(click(control.dataset.action));
  });
  root.addEventListener("change", event => change(event.target));
  root.addEventListener("keydown", event => {
    if (event.key === "Escape" && model.activityFilterOpen && !model.dialog) {
      event.preventDefault();
      const filter = model.activityFilterOpen;
      model.activityFilterOpen = "";
      draw(`filter-open:${filter}`);
      return;
    }
    const action = event.target.dataset.action;
    if (event.key === "Enter" && action?.startsWith("cache:") && action.endsWith("Seconds")) {
      event.preventDefault();
      commitCacheDuration(event.target, action.split(":")[1]);
    }
  });

  function drawScenario() {
    model = createModel(preview.scenario, model.settings, model.account);
    renderedPage = "";
    if (preview.scenario === "discover") discoverKeys();
    draw();
    const section = { cache: "ops-cache-heading", logs: "ops-logs-heading" }[preview.scenario];
    if (section) {
      const header = root.querySelector(`#${section}`);
      const main = root.querySelector(".ops-main");
      main.scrollTop += header.getBoundingClientRect().top - main.getBoundingClientRect().top - 16;
    }
  }

  draw();
  if (globalThis.Tweak) {
    const tweak = new globalThis.Tweak({ container: root, onChange: drawScenario });
    tweak.addSelect(preview, "scenario", { label: "演示场景", options: [
      { value: "ready", label: "已选账户 · 上次访问成功" },
      { value: "first-run", label: "首次安装 · 未连接" },
      { value: "picker", label: "账户选择 · 默认选中首项" },
      { value: "cli-missing", label: "CLI 未安装 · 模拟安装后重试" },
      { value: "no-accounts", label: "未读到可选账户" },
      { value: "no-access", label: "已选账户 · 尚未请求访问" },
      { value: "provider-failed", label: "已选账户 · 上次访问未获授权" },
      { value: "vault-save", label: "保险库 · 模拟一次保存失败" },
      { value: "discover", label: "SSH 密钥 · 发现进度" },
      { value: "cache", label: "设置 · 缓存下拉" },
      { value: "logs", label: "设置 · 日志" },
      { value: "startup", label: "模拟 1Password 启动" }
    ] });
    tweak.addSelect(preview, "defaultOutcome", { label: "默认代理演示结果", options: [
      { value: "success", label: "切换成功" },
      { value: "pipe-failure", label: "管道操作失败并恢复" },
      { value: "service-absent", label: "OpenSSH 服务未安装" },
      { value: "service-pending", label: "Windows 服务状态待确认" }
    ] });
  }
})();
</script>
